name: Apply verified BiDi conformance fix

on:
  push:
    branches:
      - agent/fix-bidi-conformance-20260817

permissions:
  contents: write

concurrency:
  group: apply-bidi-conformance-fix
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out exact staging branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify and apply the exact patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum .github/bidi-fix.patch.gz | awk '{print $1}')" = \
            "e0dd53e9cd680ba81d85197a122bfe2bdbd8c88fb1488980c7ad146b915f6614"
          gzip -dc .github/bidi-fix.patch.gz > /tmp/bidi-fix.patch
          test "$(sha256sum /tmp/bidi-fix.patch | awk '{print $1}')" = \
            "f575c824fbf936d868e29da4cc8021312dd1e8d544577b55ee7f0ff7ce9b77d0"
          git apply --check --index /tmp/bidi-fix.patch
          git apply --index /tmp/bidi-fix.patch

      - name: Verify the intended source-file set
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/expected-files.txt <<'EOF'
          CHANGELOG.md
          README.md
          benchmark.yaml
          docs/LEADERBOARD_POLICY_HE.md
          docs/METRICS_HE.md
          src/hebocrbench/bidi_metrics.py
          src/hebocrbench/config.py
          src/hebocrbench/data/benchmark.yaml
          src/hebocrbench/data/tracks/modern-bidi-v1.yaml
          src/hebocrbench/data/tracks/tracks.lock.json
          src/hebocrbench/evaluator.py
          src/hebocrbench/modern_score.py
          src/hebocrbench/tracks.py
          src/hebocrbench/unicode_utils.py
          tests/test_bidi_conformance_policy.py
          tests/test_bidi_metrics.py
          tests/test_config_and_statistics.py
          tests/test_evaluator.py
          tests/test_modern_score.py
          tests/test_tracks.py
          tests/test_unicode_utils.py
          tracks/modern-bidi-v1.yaml
          tracks/tracks.lock.json
          EOF
          sort -o /tmp/expected-files.txt /tmp/expected-files.txt
          git diff --cached --name-only | sort > /tmp/actual-files.txt
          diff -u /tmp/expected-files.txt /tmp/actual-files.txt
          git diff --cached --check

      - name: Commit the clean staging result
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/bidi-fix.patch.gz .github/workflows/apply-bidi-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "fix: separate BiDi conformance from OCR quality"
          git fetch origin main
          git diff --name-only origin/main...HEAD | sort > /tmp/final-files.txt
          diff -u /tmp/expected-files.txt /tmp/final-files.txt
          test -z "$(git status --porcelain)"
          git push origin HEAD:agent/fix-bidi-conformance-20260817
