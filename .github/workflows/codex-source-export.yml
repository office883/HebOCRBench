name: Codex source export

on:
  push:
    branches:
      - agent/complete-hebrew-ocr-benchmark

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out frozen source candidate
        uses: actions/checkout@v4
        with:
          ref: 7a2f756809a6323d61bb5e757c9a6e86e298ebd6
          fetch-depth: 0
      - name: Archive repository
        run: git archive --format=zip --output HebOCRBench-pr12-source.zip HEAD
      - name: Upload source archive
        uses: actions/upload-artifact@v4
        with:
          name: hebocrbench-pr12-source
          path: HebOCRBench-pr12-source.zip
          if-no-files-found: error
          retention-days: 3
