name: Finalize verified CI repair

on:
  push:
    branches:
      - agent/modern-hebrew-sota-v1-20260725
    paths:
      - .github/workflows/ci-finalize-probe.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ci-finalize-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out the exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/modern-hebrew-sota-v1-20260725
          fetch-depth: 0

      - name: Capture the guarded remote head
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          expected="$(git rev-parse HEAD)"
          remote="$(git ls-remote origin refs/heads/agent/modern-hebrew-sota-v1-20260725 | awk '{print $1}')"
          test -n "$remote"
          test "$remote" = "$expected"
          echo "expected=$expected" >> "$GITHUB_OUTPUT"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-noto-core \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-heb

      - name: Reconstruct and apply the exact repair
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/hebocr-ci-repair.patch"
          cat tools/ci-clean.b64.part* | base64 --decode > "$patch"
          printf '%s  %s\n' \
            '1c4a7329253345f713a5cb165e99b50f4364eb9d0371a152c95951bb1ec59ffc' \
            "$patch" | sha256sum --check --strict
          git apply --check "$patch"
          git apply --whitespace=fix "$patch"
          git diff --check

      - name: Install package and development dependencies on Python 3.13
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,bidi,corpus]'

      - name: Apply deterministic Ruff fixes and formatting
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check . --fix --exit-zero
          python -m ruff format .
          python -m ruff check .
          python -m ruff format --check .
          git diff --check

      - name: Verify the repaired tree on Python 3.13
        run: |
          python -m pytest -q
          python -m compileall -q src scripts
          hebocrbench tracks verify
          hebocrbench sanity --output /tmp/hebocr-sanity-313 --variants clean --limit 28

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip

      - name: Verify the repaired tree on Python 3.10
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,bidi,corpus]'
          python -m pytest -q
          python -m compileall -q src scripts
          hebocrbench tracks verify

      - name: Remove every one-shot transport and diagnostic file
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            .github/ci-repair-trigger \
            .github/workflows/ci-repair.yml \
            .github/workflows/ci-patch-probe.yml \
            .github/workflows/ci-finalize-probe.yml \
            tools/ci-repair.patch \
            tools/ci-repair-extra.patch \
            tools/ci-clean.b64.part*
          git diff --check

      - name: Commit and push atomically
        shell: bash
        env:
          EXPECTED_REMOTE_HEAD: ${{ steps.guard.outputs.expected }}
        run: |
          set -euo pipefail
          git config user.name 'HebOCRBench CI repair'
          git config user.email 'actions@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'fix: restore Python 3.10 and Ruff CI'
          git push \
            --force-with-lease=refs/heads/agent/modern-hebrew-sota-v1-20260725:$EXPECTED_REMOTE_HEAD \
            origin HEAD:refs/heads/agent/modern-hebrew-sota-v1-20260725
