name: Publish page-level preflight diagnostics

on:
  push:
    branches:
      - agent/modern-hebrew-sota-v1-20260725
    paths:
      - .github/workflows/preflight-diagnostics-repair.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preflight-diagnostics-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out exact PR branch
        uses: actions/checkout@v4
        with:
          ref: agent/modern-hebrew-sota-v1-20260725
          fetch-depth: 0

      - name: Guard the remote branch identity
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          git fetch origin agent/modern-hebrew-sota-v1-20260725
          test "$(git rev-parse origin/agent/modern-hebrew-sota-v1-20260725)" = "$base"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install deterministic test stack
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-noto-core \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-heb
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,bidi,corpus]'

      - name: Verify and apply the audited source patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%s  %s\n' \
            '194592415e203f40cdc9831889a7886963a764b517c5dece2d9b1502abc08cf7' \
            tools/preflight-diagnostics.patch | sha256sum --check --strict
          git apply --check tools/preflight-diagnostics.patch
          git apply tools/preflight-diagnostics.patch
          git diff --check

      - name: Verify the regression and the complete package
        run: |
          python -m pytest -q tests/test_modern_public_materializer.py
          python -m pytest -q
          python -m ruff check .
          python -m ruff format --check .
          python -m compileall -q src scripts
          hebocrbench tracks verify

      - name: Commit the verified source-only change
        shell: bash
        run: |
          set -euo pipefail
          rm tools/preflight-diagnostics.patch
          git restore --source=HEAD --worktree --staged .github/workflows
          git config user.name 'HebOCRBench preflight diagnostics'
          git config user.email 'actions@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'feat: preserve page-level PDF rejection evidence'
          git fetch origin agent/modern-hebrew-sota-v1-20260725
          remote="$(git rev-parse origin/agent/modern-hebrew-sota-v1-20260725)"
          test "$remote" = "$BASE_SHA"
          git push \
            --force-with-lease=refs/heads/agent/modern-hebrew-sota-v1-20260725:$BASE_SHA \
            origin HEAD:refs/heads/agent/modern-hebrew-sota-v1-20260725
