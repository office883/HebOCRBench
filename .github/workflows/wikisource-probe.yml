name: HebOCRBench Wikisource source probe

on:
  pull_request:
    paths:
      - .github/wikisource-v1-trigger
      - .github/workflows/wikisource-probe.yml
      - tools/wikisource-materializer.py.xz.b64

permissions:
  contents: read

env:
  MATERIALIZER_SHA256: 2a04bf2f7a1b100b318355f59c82df0187151cd43a0d6cb501b47300ae23a181

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Restore materializer
        shell: bash
        run: |
          set -euo pipefail
          script="$RUNNER_TEMP/materialize_v1_sources.py"
          base64 --decode tools/wikisource-materializer.py.xz.b64 | xz --decompress > "$script"
          printf '%s  %s\n' "$MATERIALIZER_SHA256" "$script" | sha256sum --check --strict
      - name: Probe live category and rights
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/materialize_v1_sources.py" "$RUNNER_TEMP/probe.json" <<'PY'
          from collections import Counter
          import importlib.util, json, re, sys
          from pathlib import Path
          script, output = Path(sys.argv[1]), Path(sys.argv[2])
          spec = importlib.util.spec_from_file_location('hebocrbench_probe', script)
          module = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(module)
          titles = module._category_members()
          grouped = [module._page_parts(title) for title in titles]
          counts = Counter(document for document, _ in grouped)
          rights = module._file_metadata(document for document, _ in grouped)
          details = {}
          for document in sorted(counts):
              info = rights.get(document, {})
              ext = info.get('extmetadata') or {}
              values = {
                  key: module._ext_value(ext, key)
                  for key in (
                      'LicenseShortName', 'LicenseUrl', 'Copyrighted', 'UsageTerms',
                      'AttributionRequired', 'Artist', 'Credit', 'DateTimeOriginal',
                  )
              }
              details[document] = {
                  'validated_page_count': counts[document],
                  'approved': module._approved_file_rights(ext),
                  'sha1': info.get('sha1'),
                  'mime': info.get('mime'),
                  **values,
              }
          approved = sorted(name for name, item in details.items() if item['approved'])
          approved_set = set(approved)
          candidates = sorted(title for title in titles if module._page_parts(title)[0] in approved_set)
          payload = {
              'category_member_count': len(titles),
              'metadata_document_count': len(rights),
              'approved_document_count': len(approved),
              'candidate_page_count': len(candidates),
              'approved_documents': approved,
              'unapproved_documents': sorted(set(counts) - approved_set),
              'document_details': details,
              'first_candidates': candidates[:20],
              'last_candidates': candidates[-20:],
          }
          output.write_text(json.dumps(payload, ensure_ascii=False, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps({
              'category_member_count': payload['category_member_count'],
              'approved_document_count': payload['approved_document_count'],
              'candidate_page_count': payload['candidate_page_count'],
              'unapproved_documents': payload['unapproved_documents'],
          }, ensure_ascii=False, sort_keys=True))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: wikisource-live-source-probe
          path: ${{ runner.temp }}/probe.json
          if-no-files-found: error
          retention-days: 3
          compression-level: 0
