name: ci

on:
  push:
    branches:
      - agent/tesseract-v1-1-run
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: materialize-tesseract-v1-1-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize-release-workflow:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out isolated run branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/tesseract-v1-1-run
          fetch-depth: 0

      - name: Materialize the reviewed release-workflow patch without pushing it
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check PyYAML==6.0.3
          python - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(
              Path('.github/workflows/bootstrap-tesseract-v1-1.yml').read_text(
                  encoding='utf-8'
              )
          )
          script = workflow['jobs']['patch-release-workflow']['steps'][1]['run']
          script = script.split('\ngit diff --check\n', 1)[0]
          Path('/tmp/materialize-release.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/materialize-release.sh
          mkdir -p /tmp/patched-release-workflow
          cp .github/workflows/modern-v1-release.yml \
            /tmp/patched-release-workflow/modern-v1-release.yml
          sha256sum /tmp/patched-release-workflow/modern-v1-release.yml \
            | tee /tmp/patched-release-workflow/modern-v1-release.yml.sha256
          git diff --check

      - name: Upload the exact patched release workflow
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: tesseract-v1-1-patched-release-workflow
          path: /tmp/patched-release-workflow
          if-no-files-found: error
          compression-level: 9
          retention-days: 7
