name: ci

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write

concurrency:
  group: dispatch-tesseract-v1-1-${{ github.event.pull_request.head.ref }}
  cancel-in-progress: true

jobs:
  dispatch-full-tesseract-run:
    if: github.head_ref == 'agent/tesseract-v1-1-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out isolated run branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: agent/tesseract-v1-1-run
          fetch-depth: 1

      - name: Format and verify the branch-only hooks
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,bidi,corpus]'
          python -m ruff format \
            src/hebocrbench/harfbuzz_14_3_pin.py \
            src/hebocrbench/tesseract_v11_release_hook.py \
            src/sitecustomize.py \
            tests/test_harfbuzz_14_3_pin.py \
            tests/test_tesseract_v11_release_hook.py
          python -m ruff check \
            src/hebocrbench/harfbuzz_14_3_pin.py \
            src/hebocrbench/tesseract_v11_release_hook.py \
            src/sitecustomize.py \
            tests/test_harfbuzz_14_3_pin.py \
            tests/test_tesseract_v11_release_hook.py
          python -m pytest -q \
            tests/test_harfbuzz_14_3_pin.py \
            tests/test_tesseract_v11_release_hook.py
          python -m compileall -q \
            src/hebocrbench/harfbuzz_14_3_pin.py \
            src/hebocrbench/tesseract_v11_release_hook.py \
            src/sitecustomize.py

          if ! git diff --quiet -- \
            src/hebocrbench/harfbuzz_14_3_pin.py \
            src/hebocrbench/tesseract_v11_release_hook.py \
            src/sitecustomize.py \
            tests/test_harfbuzz_14_3_pin.py \
            tests/test_tesseract_v11_release_hook.py; then
            git config user.name "github-actions[bot]"
            git config user.email \
              "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/hebocrbench/harfbuzz_14_3_pin.py \
              src/hebocrbench/tesseract_v11_release_hook.py \
              src/sitecustomize.py \
              tests/test_harfbuzz_14_3_pin.py \
              tests/test_tesseract_v11_release_hook.py
            git commit -m "style: apply Ruff formatting to isolated run hooks"
            git push origin HEAD:agent/tesseract-v1-1-run
          fi

      - name: Dispatch the certified release workflow on this exact branch
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_BRANCH: agent/tesseract-v1-1-run
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          started_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          python - "$GITHUB_REPOSITORY" "$TARGET_BRANCH" "$GH_TOKEN" <<'PY'
          import json
          import sys
          import urllib.request

          repository, branch, token = sys.argv[1:]
          request = urllib.request.Request(
              f"https://api.github.com/repos/{repository}/actions/workflows/modern-v1-release.yml/dispatches",
              data=json.dumps({"ref": branch}).encode("utf-8"),
              method="POST",
              headers={
                  "Accept": "application/vnd.github+json",
                  "Authorization": f"Bearer {token}",
                  "X-GitHub-Api-Version": "2022-11-28",
                  "Content-Type": "application/json",
                  "User-Agent": "HebOCRBench-Tesseract-v1.1-dispatcher",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise RuntimeError(f"workflow dispatch returned HTTP {response.status}")
          PY

          python - "$GITHUB_REPOSITORY" "$TARGET_BRANCH" "$head_sha" "$started_at" "$GH_TOKEN" <<'PY'
          import datetime as dt
          import json
          from pathlib import Path
          import sys
          import time
          import urllib.parse
          import urllib.request

          repository, branch, head_sha, started_at, token = sys.argv[1:]
          threshold = dt.datetime.fromisoformat(
              started_at.replace("Z", "+00:00")
          ) - dt.timedelta(seconds=10)
          query = urllib.parse.urlencode(
              {"branch": branch, "event": "workflow_dispatch", "per_page": 20}
          )
          url = (
              f"https://api.github.com/repos/{repository}/actions/workflows/"
              f"modern-v1-release.yml/runs?{query}"
          )
          headers = {
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
              "User-Agent": "HebOCRBench-Tesseract-v1.1-dispatcher",
          }
          selected = None
          for _ in range(30):
              request = urllib.request.Request(url, headers=headers)
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)
              for run in payload.get("workflow_runs", []):
                  created = dt.datetime.fromisoformat(
                      run["created_at"].replace("Z", "+00:00")
                  )
                  if run.get("head_sha") == head_sha and created >= threshold:
                      selected = run
                      break
              if selected is not None:
                  break
              time.sleep(3)
          if selected is None:
              raise RuntimeError(
                  "dispatched workflow run was not discoverable within 90 seconds"
              )
          output = {
              "schema_version": "1.0",
              "repository": repository,
              "branch": branch,
              "head_sha": head_sha,
              "run_id": selected["id"],
              "run_number": selected["run_number"],
              "status": selected["status"],
              "html_url": selected["html_url"],
              "created_at": selected["created_at"],
          }
          Path("/tmp/full-tesseract-run.json").write_text(
              json.dumps(output, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(output, indent=2, sort_keys=True))
          PY

      - name: Upload full-run identifier
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: full-tesseract-v1-1-run-id
          path: /tmp/full-tesseract-run.json
          if-no-files-found: error
          retention-days: 7
