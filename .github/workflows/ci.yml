name: ci

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-noto-core \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-heb

      - name: Install package and test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,bidi,corpus]'

      - name: Verify repository has no whitespace errors
        run: git diff --check

      - name: Run tests
        run: python -m pytest -q

      - name: Compile runtime modules
        run: python -m compileall -q src scripts

      - name: Verify official track lock
        run: hebocrbench tracks verify

      - name: Verify packaged registry and profiles
        run: |
          hebocrbench data list > /tmp/hebocrbench-sources.json
          hebocrbench data profiles > /tmp/hebocrbench-profiles.json
          python - <<'PY'
          import json
          sources = json.load(open('/tmp/hebocrbench-sources.json', encoding='utf-8'))
          profiles = json.load(open('/tmp/hebocrbench-profiles.json', encoding='utf-8'))
          assert {item['source_id'] for item in sources['sources']} == {
              'modern-bidi-diagnostic-v1',
              'modern-handwriting-lines-v1',
              'modern-print-lines-development-v1',
              'modern-public-documents-v1',
          }
          assert {item['profile_id'] for item in profiles['profiles']} == {
              'modern-hebrew-development-v1',
              'modern-hebrew-handwriting-v1',
              'modern-hebrew-print-v1',
          }
          PY

      - name: Run evaluator fault-injection matrix
        run: hebocrbench sanity --output /tmp/hebocr-sanity --variants clean --limit 28

      - name: Lint and format check
        if: matrix.python-version == '3.13'
        shell: bash
        run: |
          set +e
          python -m ruff check . 2>&1 | tee /tmp/ruff-check.txt
          lint_status=${PIPESTATUS[0]}
          python -m ruff format --check . 2>&1 | tee /tmp/ruff-format.txt
          format_status=${PIPESTATUS[0]}
          printf 'lint_status=%s\nformat_status=%s\n' \
            "$lint_status" "$format_status" | tee /tmp/ruff-status.txt
          if (( lint_status != 0 || format_status != 0 )); then
            exit 1
          fi

      - name: Upload Ruff diagnostics
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: ruff-diagnostics-python-3.13
          path: |
            /tmp/ruff-check.txt
            /tmp/ruff-format.txt
            /tmp/ruff-status.txt
          if-no-files-found: warn
          retention-days: 7

  package:
    name: Build and inspect distributions
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Build wheel and source distribution
        run: |
          python -m pip install --upgrade pip
          python -m pip install 'build>=1.2,<2'
          python -m build

      - name: Install wheel in an isolated environment
        shell: bash
        run: |
          set -euo pipefail
          python -m venv /tmp/hebocrbench-wheel
          /tmp/hebocrbench-wheel/bin/python -m pip install --upgrade pip
          /tmp/hebocrbench-wheel/bin/python -m pip install dist/hebocrbench-1.0.0-py3-none-any.whl
          /tmp/hebocrbench-wheel/bin/python -m pip check
          /tmp/hebocrbench-wheel/bin/hebocrbench --version
          /tmp/hebocrbench-wheel/bin/hebocrbench tracks verify
          /tmp/hebocrbench-wheel/bin/hebocrbench data profiles > /tmp/wheel-profiles.json
          /tmp/hebocrbench-wheel/bin/python - <<'PY'
          import json
          from importlib import resources
          import hebocrbench
          assert hebocrbench.__version__ == '1.0.0'
          profiles = json.load(open('/tmp/wheel-profiles.json', encoding='utf-8'))
          assert len(profiles['profiles']) == 3
          track_names = {
              item.name
              for item in resources.files('hebocrbench').joinpath('data/tracks').iterdir()
              if item.name.endswith('.yaml')
          }
          assert track_names == {
              'modern-bidi-v1.yaml',
              'modern-forms-v1.yaml',
              'modern-handwriting-v1.yaml',
              'modern-line-recognition-v1.yaml',
              'modern-page-ocr-v1.yaml',
              'modern-robustness-v1.yaml',
              'modern-tables-v1.yaml',
          }
          PY

      - name: Verify archive hygiene
        shell: bash
        run: |
          set -euo pipefail
          tar -tzf dist/hebocrbench-1.0.0.tar.gz > /tmp/sdist-files.txt
          ! grep -E '(__pycache__|\.py[co]$|\.git/|\.pytest_cache/|\.bootstrap/)' /tmp/sdist-files.txt

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: hebocrbench-python-distributions
          path: dist/*
          if-no-files-found: error
          retention-days: 14
