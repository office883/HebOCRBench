name: Bootstrap standalone HebOCRBench v1 source

on:
  push:
    paths:
      - '.bootstrap/v4/run.txt'
  workflow_dispatch:

permissions:
  contents: write

env:
  BASE_ARCHIVE_SHA256: 2f18b65b14de12c288592423a678a071e00e165988b28a57b521370a4982a29f
  PATCH_GZIP_SHA256: 76867ef79c92b38a171a5b10dc2aaa09d73dfa10dc023b6fccd713d8058f4150
  PATCH_SHA256: ad62c09fd19e90d125a996e97157eb32f1d475d9d4bca16a68160e882d0093a4

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out standalone repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Reconstruct and verify the source tree
        shell: bash
        run: |
          set -euo pipefail
          root="$RUNNER_TEMP/hebocr-source"
          archive="$RUNNER_TEMP/HebOCRBench-base.tar.xz"
          patch_gz="$RUNNER_TEMP/HebOCRBench-current.patch.gz"
          patch="$RUNNER_TEMP/HebOCRBench-current.patch"

          mkdir -p "$root"
          cat \
            .bootstrap/v3/import.b64.part00 \
            .bootstrap/v3/import.b64.part01 \
            | base64 --decode > "$archive"
          printf '%s  %s\n' "$BASE_ARCHIVE_SHA256" "$archive" | sha256sum --check --strict
          tar -xJf "$archive" -C "$root"

          base64 --decode .bootstrap/v4/current.patch.gz.b64 > "$patch_gz"
          printf '%s  %s\n' "$PATCH_GZIP_SHA256" "$patch_gz" | sha256sum --check --strict
          gzip --decompress --stdout "$patch_gz" > "$patch"
          printf '%s  %s\n' "$PATCH_SHA256" "$patch" | sha256sum --check --strict

          git -C "$root" init --quiet
          git -C "$root" config user.name 'HebOCRBench bootstrap verifier'
          git -C "$root" config user.email 'actions@users.noreply.github.com'
          git -C "$root" add --all
          git -C "$root" commit --quiet -m base
          git -C "$root" apply --check "$patch"
          git -C "$root" apply "$patch"

      - name: Verify reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/hebocr-source"
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,bidi]'
          python -m pytest -q
          python -m compileall -q src
          python -m ruff check .

      - name: Replace bootstrap repository with verified source
        shell: bash
        run: |
          set -euo pipefail
          rsync -a --delete --exclude='.git/' "$RUNNER_TEMP/hebocr-source/" ./
          git config user.name 'HebOCRBench release automation'
          git config user.email 'actions@users.noreply.github.com'
          git add --all
          git diff --cached --check
          git commit -m 'chore: import standalone HebOCRBench v1 source'
          git push origin HEAD:main
