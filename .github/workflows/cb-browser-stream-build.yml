name: Temporary Christina Block browser stream build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cb-browser-stream-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install Chromium and media tools
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg ca-certificates
          python -m pip install --quiet --upgrade playwright requests
          python -m playwright install --with-deps chromium
          ffmpeg -version | head -n 3

      - name: Capture playable Googlevideo streams in Chromium
        run: |
          set -euxo pipefail
          cat > /tmp/capture_streams.py <<'PY'
          from __future__ import annotations

          import asyncio
          import json
          import pathlib
          import re
          import traceback
          from urllib.parse import parse_qs, unquote, urlparse

          from playwright.async_api import async_playwright

          VIDEO_ID = "HOW33afxE6g"
          OUT = pathlib.Path("browser_stream")
          OUT.mkdir(exist_ok=True)
          pages = [
              f"https://www.youtube.com/embed/{VIDEO_ID}?autoplay=1&mute=1&playsinline=1&controls=1",
              f"https://www.youtube-nocookie.com/embed/{VIDEO_ID}?autoplay=1&mute=1&playsinline=1&controls=1",
              f"https://www.youtube.com/watch?v={VIDEO_ID}&autoplay=1",
          ]
          report = {"video_id": VIDEO_ID, "attempts": []}
          selected = None

          def parse_media(url: str) -> dict:
              p = urlparse(url)
              q = parse_qs(p.query)
              mime = unquote((q.get("mime") or [""])[0])
              itag = (q.get("itag") or [""])[0]
              clen = (q.get("clen") or [""])[0]
              return {
                  "url": url,
                  "host": p.netloc,
                  "path": p.path,
                  "mime": mime,
                  "itag": itag,
                  "clen": clen,
                  "query_keys": sorted(q.keys()),
              }

          async def attempt(browser, target: str, index: int):
              global selected
              rec = {"target": target, "media": [], "player": [], "console": []}
              context = await browser.new_context(
                  viewport={"width": 1280, "height": 720},
                  locale="de-DE",
                  timezone_id="Europe/Berlin",
                  user_agent=(
                      "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 "
                      "(KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36"
                  ),
                  extra_http_headers={"Accept-Language": "de-DE,de;q=0.9,en;q=0.7"},
              )
              page = await context.new_page()

              async def on_request(request):
                  u = request.url
                  if "googlevideo.com" in u and ("videoplayback" in u or "/initplayback" in u):
                      item = parse_media(u)
                      try:
                          item["headers"] = await request.all_headers()
                      except Exception:
                          item["headers"] = {}
                      if not any(x.get("url") == u for x in rec["media"]):
                          rec["media"].append(item)

              async def on_response(response):
                  if "youtubei/v1/player" in response.url:
                      item = {"url": response.url, "status": response.status}
                      try:
                          body = await response.json()
                          item["playability"] = body.get("playabilityStatus")
                          item["videoDetails"] = body.get("videoDetails")
                          item["streamingData_keys"] = list((body.get("streamingData") or {}).keys())
                          (OUT / f"player_response_{index}_{len(rec['player'])}.json").write_text(
                              json.dumps(body, ensure_ascii=False, indent=2), encoding="utf-8"
                          )
                      except Exception:
                          item["error"] = traceback.format_exc()
                      rec["player"].append(item)

              page.on("request", on_request)
              page.on("response", on_response)
              page.on("console", lambda msg: rec["console"].append(f"{msg.type}: {msg.text}"))
              try:
                  await page.goto(target, wait_until="domcontentloaded", timeout=60_000)
                  await page.wait_for_timeout(8_000)
                  for selector in [
                      "button:has-text('Accept all')",
                      "button:has-text('I agree')",
                      "button:has-text('Alle akzeptieren')",
                      ".ytp-large-play-button",
                      "button.ytp-large-play-button",
                  ]:
                      try:
                          loc = page.locator(selector).first
                          if await loc.count() and await loc.is_visible(timeout=1000):
                              await loc.click(force=True, timeout=3000)
                              await page.wait_for_timeout(3000)
                      except Exception:
                          pass
                  try:
                      rec["video_before"] = await page.evaluate(
                          """() => { const v=document.querySelector('video'); return v ? {currentTime:v.currentTime,duration:v.duration,paused:v.paused,readyState:v.readyState,currentSrc:v.currentSrc,error:v.error?{code:v.error.code,message:v.error.message}:null} : {found:false}; }"""
                      )
                      rec["play_call"] = await page.evaluate(
                          """async () => { const v=document.querySelector('video'); if(!v) return {found:false}; v.muted=true; try {await v.play();} catch(e) {return {found:true,error:String(e)}} return {found:true,ok:true}; }"""
                      )
                  except Exception:
                      rec["play_eval_error"] = traceback.format_exc()
                  await page.wait_for_timeout(18_000)
                  try:
                      rec["video_after"] = await page.evaluate(
                          """() => { const v=document.querySelector('video'); return v ? {currentTime:v.currentTime,duration:v.duration,paused:v.paused,readyState:v.readyState,currentSrc:v.currentSrc,videoWidth:v.videoWidth,videoHeight:v.videoHeight,error:v.error?{code:v.error.code,message:v.error.message}:null} : {found:false}; }"""
                      )
                  except Exception:
                      rec["video_after_error"] = traceback.format_exc()
                  rec["title"] = await page.title()
                  rec["body"] = (await page.locator("body").inner_text(timeout=10_000))[:10_000]
                  await page.screenshot(path=str(OUT / f"attempt_{index}.png"), full_page=False)
              except Exception:
                  rec["error"] = traceback.format_exc()
                  try:
                      await page.screenshot(path=str(OUT / f"attempt_{index}_error.png"), full_page=False)
                  except Exception:
                      pass
              finally:
                  await context.close()
              return rec

          async def main():
              global selected
              async with async_playwright() as p:
                  browser = await p.chromium.launch(
                      headless=True,
                      args=[
                          "--autoplay-policy=no-user-gesture-required",
                          "--disable-blink-features=AutomationControlled",
                          "--disable-dev-shm-usage",
                          "--no-sandbox",
                      ],
                  )
                  for i, target in enumerate(pages):
                      rec = await attempt(browser, target, i)
                      report["attempts"].append(rec)
                      print("ATTEMPT", i, "title=", rec.get("title"), "media=", len(rec.get("media", [])), "video=", rec.get("video_after"), flush=True)
                      media = rec.get("media", [])
                      videos = [m for m in media if str(m.get("mime", "")).startswith("video/")]
                      audios = [m for m in media if str(m.get("mime", "")).startswith("audio/")]
                      muxed = [m for m in media if not m.get("mime") or ("audio" in str(m.get("mime")) and "video" in str(m.get("mime")))]
                      if videos and audios:
                          selected = {"kind": "separate", "video": videos[-1], "audio": audios[-1], "referer": target}
                          break
                      if muxed:
                          selected = {"kind": "single", "media": muxed[-1], "referer": target}
                          break
                  await browser.close()
              report["selected"] = selected
              (OUT / "report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2, default=str), encoding="utf-8")
              if not selected:
                  raise SystemExit("Chromium did not receive any usable Googlevideo media stream")
              pathlib.Path("selected_streams.json").write_text(json.dumps(selected, ensure_ascii=False, indent=2, default=str), encoding="utf-8")

          asyncio.run(main())
          PY
          python /tmp/capture_streams.py 2>&1 | tee browser_stream_capture.log
          cat selected_streams.json

      - name: Download captured full streams
        run: |
          set -euxo pipefail
          cat > /tmp/download_selected.py <<'PY'
          from __future__ import annotations
          import json, pathlib, subprocess, traceback
          import requests

          sel=json.load(open('selected_streams.json',encoding='utf-8'))
          ua='Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0.0.0 Safari/537.36'
          referer=sel.get('referer','https://www.youtube.com/')

          def dl(url,path):
              headers={'User-Agent':ua,'Referer':referer,'Accept':'*/*'}
              with requests.get(url,headers=headers,stream=True,allow_redirects=True,timeout=(30,3600)) as r:
                  print('HTTP',r.status_code,r.headers.get('content-type'),r.headers.get('content-length'),flush=True)
                  r.raise_for_status()
                  total=0
                  with open(path,'wb') as f:
                      for chunk in r.iter_content(1024*1024):
                          if chunk:
                              f.write(chunk); total+=len(chunk)
                              if total%(50*1024*1024)<1024*1024: print('bytes',total,flush=True)
              if pathlib.Path(path).stat().st_size<1_000_000:
                  raise RuntimeError(f'{path} too small')

          if sel['kind']=='separate':
              dl(sel['video']['url'],'captured_video.bin')
              dl(sel['audio']['url'],'captured_audio.bin')
              subprocess.run(['ffmpeg','-hide_banner','-loglevel','error','-y','-i','captured_video.bin','-i','captured_audio.bin','-map','0:v:0','-map','1:a:0','-c','copy','reaction_source.mkv'],check=True,timeout=1800)
          else:
              dl(sel['media']['url'],'reaction_source.mp4')
          PY
          python /tmp/download_selected.py 2>&1 | tee browser_stream_download.log
          INPUT="$(find . -maxdepth 1 -type f \( -name 'reaction_source.mkv' -o -name 'reaction_source.mp4' \) | head -n 1)"
          test -n "$INPUT"
          echo "INPUT=$INPUT" >> "$GITHUB_ENV"
          ffprobe -v error -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels -of json "$INPUT" | tee source_probe.json
          python - <<'PY'
          import json
          d=json.load(open('source_probe.json'))
          duration=float(d['format']['duration'])
          streams=d.get('streams',[])
          assert 2545<=duration<=2565,duration
          assert any(s.get('codec_type')=='video' for s in streams)
          assert any(s.get('codec_type')=='audio' for s in streams)
          print('Valid source duration',duration)
          PY

      - name: Render exact 38 clean middle segments
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          segments=[
            (400,418),(424,451),(467,470),(473,494),
            (518,553),(558,648),(691,696),(708,710),
            (726,734),(735,761),(772,799),(821,825),
            (826,871),(888,945),(985,998),(1005,1098),
            (1123,1126),(1139,1141),(1150,1164),(1167,1180),
            (1195,1214),(1235,1238),(1254,1270),(1291,1303),
            (1312,1314),(1325,1335),(1340,1344),(1346,1431),
            (1487,1503),(1509,1542),(1549,1575),(1584,1627),
            (1657,1661),(1671,1726),(1734,1783),(1799,1813),
            (1836,1859),(1883,2021),
          ]
          assert len(segments)==38 and sum(b-a for a,b in segments)==1058
          Path('segments.tsv').write_text('\n'.join(f'{i:02d}\t{a}\t{b}' for i,(a,b) in enumerate(segments)),encoding='utf-8')
          Path('middle_manifest.txt').write_text('segments=38\nexpected_duration_seconds=1058\n'+'\n'.join(f'{i+1:02d}: {a}-{b} ({b-a}s)' for i,(a,b) in enumerate(segments))+'\n',encoding='utf-8')
          PY
          mkdir -p rendered_segments
          : > concat.txt
          while IFS=$'\t' read -r idx start end; do
            duration=$((end-start))
            ffmpeg -hide_banner -loglevel error -y -ss "$start" -i "$INPUT" -t "$duration" \
              -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p" \
              -af "aresample=48000:async=1:first_pts=0,aformat=sample_fmts=fltp:sample_rates=48000:channel_layouts=stereo" \
              -c:v libx264 -preset veryfast -crf 18 -profile:v high -level 4.1 \
              -c:a aac -b:a 192k -ar 48000 -ac 2 "rendered_segments/seg_${idx}.mp4"
            printf "file '%s'\n" "$PWD/rendered_segments/seg_${idx}.mp4" >> concat.txt
          done < segments.tsv
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i concat.txt -c copy -movflags +faststart middle_clean.mp4
          ffprobe -v error -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels -of json middle_clean.mp4 | tee middle_probe.json
          python - <<'PY'
          import json
          d=json.load(open('middle_probe.json'))
          duration=float(d['format']['duration'])
          assert 1057.4<=duration<=1059.0,duration
          print(f'Validated middle: {duration:.3f}s')
          PY
          ffmpeg -v error -i middle_clean.mp4 -f null -
          sha256sum middle_clean.mp4 | tee middle_clean.sha256

      - name: Upload clean middle and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: christina-block-browser-stream-middle
          path: |
            middle_clean.mp4
            middle_clean.sha256
            middle_probe.json
            middle_manifest.txt
            source_probe.json
            selected_streams.json
            browser_stream/
            browser_stream_capture.log
            browser_stream_download.log
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
