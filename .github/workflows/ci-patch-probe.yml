name: Probe CI repair patches

on:
  pull_request:
    branches: [main]
    paths:
      - tools/ci-repair.patch
      - tools/ci-repair-extra.patch
      - .github/workflows/ci-patch-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/modern-hebrew-sota-v1-20260725
          fetch-depth: 0

      - name: Probe each patch boundary
        shell: bash
        run: |
          set +e
          report=/tmp/patch-probe.txt
          exec > >(tee "$report") 2>&1
          echo "head=$(git rev-parse HEAD)"
          echo "main_blob=$(git hash-object tools/ci-repair.patch)"
          echo "extra_blob=$(git hash-object tools/ci-repair-extra.patch)"
          echo '=== main check ==='
          git apply --check --verbose tools/ci-repair.patch
          echo "main_check=$?"
          echo '=== main apply ==='
          git apply --verbose tools/ci-repair.patch
          echo "main_apply=$?"
          echo '=== extra check ==='
          git apply --check --verbose tools/ci-repair-extra.patch
          echo "extra_check=$?"
          echo '=== diff after main ==='
          git diff -- tests/test_tesseract_adapter.py src/hebocrbench/adapters/tesseract.py
          exit 0

      - uses: actions/upload-artifact@v4
        with:
          name: ci-patch-probe
          path: /tmp/patch-probe.txt
          if-no-files-found: error
          retention-days: 7
