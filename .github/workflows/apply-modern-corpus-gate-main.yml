name: Apply verified Modern Hebrew corpus gate repair on main

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/apply-modern-corpus-gate-main.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modern-corpus-gate-main-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply-verify-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out exact main head
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Freeze remote main identity
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$base"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install deterministic system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-noto-core \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-heb \
            xz-utils

      - name: Reconstruct and apply exact audited patch
        shell: bash
        run: |
          set -euo pipefail
          compressed="$RUNNER_TEMP/modern-corpus-gate.patch.xz"
          patch="$RUNNER_TEMP/modern-corpus-gate.patch"
          base64 --decode .github/modern-corpus-gate.patch.xz.b64 > "$compressed"
          printf '%s  %s\n' \
            '00638f254028609d1d2a42fcd7861fc7cd9624912ab9c9d1177fb480c0f118da' \
            "$compressed" | sha256sum --check --strict
          xz --decompress --stdout "$compressed" > "$patch"
          printf '%s  %s\n' \
            '9542047be4e39fd2274f5d9db7e6e9724afceea2e45f26c9a2b7a599825a3e45' \
            "$patch" | sha256sum --check --strict
          git apply --check --verbose "$patch"
          git apply --verbose "$patch"
          git diff --check

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,bidi,corpus]'

      - name: Normalize changed files and require strict Ruff
        shell: bash
        run: |
          set -euo pipefail
          files=(
            scripts/build_modern_public_corpus.py
            src/hebocrbench/converters/modern_pdf.py
            tests/test_modern_pdf_agreement.py
            tests/test_modern_public_materializer.py
          )
          python -m ruff check "${files[@]}" --fix --exit-zero
          python -m ruff format "${files[@]}"
          python -m ruff check .
          python -m ruff format --check .
          git diff --check

      - name: Run focused regression tests
        run: |
          python -m pytest -q \
            tests/test_modern_pdf_agreement.py \
            tests/test_modern_public_materializer.py

      - name: Run complete verification
        run: |
          python -m pytest -q
          python -m compileall -q src scripts
          hebocrbench tracks verify
          hebocrbench sanity \
            --output "$RUNNER_TEMP/hebocr-sanity" \
            --variants clean \
            --limit 28

      - name: Commit verified source atomically to main
        shell: bash
        run: |
          set -euo pipefail
          expected=$'scripts/build_modern_public_corpus.py\nsrc/hebocrbench/converters/modern_pdf.py\ntests/test_modern_pdf_agreement.py\ntests/test_modern_public_materializer.py'
          actual="$(git status --porcelain=v1 | sed -E 's/^...//' | sort)"
          test "$actual" = "$(printf '%s\n' "$expected" | sort)"
          git config user.name 'HebOCRBench corpus gate'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            scripts/build_modern_public_corpus.py \
            src/hebocrbench/converters/modern_pdf.py \
            tests/test_modern_pdf_agreement.py \
            tests/test_modern_public_materializer.py
          git diff --cached --check
          git commit -m 'fix: make the Modern Hebrew corpus gate scientifically usable'
          git fetch origin main
          remote="$(git rev-parse origin/main)"
          test "$remote" = "$BASE_SHA"
          git push \
            --force-with-lease=refs/heads/main:$BASE_SHA \
            origin HEAD:refs/heads/main
