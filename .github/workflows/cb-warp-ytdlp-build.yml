name: Temporary Christina Block WARP middle build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cb-warp-ytdlp-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-middle:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install media and downloader tools before tunnel
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg nodejs npm ca-certificates curl
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade 'yt-dlp[default,curl-cffi]' bgutil-ytdlp-pot-provider
          yt-dlp --version
          ffmpeg -version | head -n 3
          node --version
          docker pull brainicism/bgutil-ytdlp-pot-provider:latest
          docker run --name bgutil-provider -d --init --net=host brainicism/bgutil-ytdlp-pot-provider:latest
          sleep 5
          curl -fsS http://127.0.0.1:4416/ || true
          docker logs bgutil-provider | tail -n 50 || true

      - name: Record pre-tunnel network
        run: |
          set -euxo pipefail
          {
            echo 'PRE_WARP_IP:'
            curl -fsS --max-time 30 https://api.ipify.org || true
            echo
            curl -fsS --max-time 30 https://www.cloudflare.com/cdn-cgi/trace || true
          } | tee network_before.txt

      - name: Set up Cloudflare WARP
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: ipv4
          mode: wireguard

      - name: Verify tunneled network
        run: |
          set -euxo pipefail
          {
            echo 'POST_WARP_IP:'
            curl -fsS --max-time 30 https://api.ipify.org || true
            echo
            curl -fsS --max-time 30 https://www.cloudflare.com/cdn-cgi/trace || true
          } | tee network_after.txt
          grep -Eq 'warp=(on|plus)' network_after.txt
          curl -fsS --max-time 30 http://127.0.0.1:4416/ || true

      - name: Download reaction video through WARP
        run: |
          set -euxo pipefail
          URL='https://www.youtube.com/watch?v=HOW33afxE6g'
          rm -f reaction.*
          : > yt_dlp_download.log
          success=0

          run_try() {
            label="$1"; shift
            echo "===== ATTEMPT: $label =====" | tee -a yt_dlp_download.log
            if yt-dlp -v \
              --no-playlist --newline \
              --retries 12 --fragment-retries 12 --concurrent-fragments 4 \
              --js-runtimes node --remote-components ejs:github \
              --impersonate chrome \
              -f 'bv*[height<=720]+ba/b[height<=720]' \
              --merge-output-format mkv \
              -o 'reaction.%(ext)s' \
              "$@" "$URL" 2>&1 | tee -a yt_dlp_download.log; then
                success=1
                return 0
            fi
            rm -f reaction.*
            return 1
          }

          run_try 'WARP + POT default clients' || \
          run_try 'WARP + POT web_safari' --extractor-args 'youtube:player_client=web_safari' || \
          run_try 'WARP + POT mweb' --extractor-args 'youtube:player_client=mweb' || \
          run_try 'WARP + POT tv_embedded' --extractor-args 'youtube:player_client=tv_embedded' || true

          test "$success" -eq 1
          INPUT="$(find . -maxdepth 1 -type f -name 'reaction.*' ! -name '*.part' ! -name '*.ytdl' -printf '%f\n' | head -n 1)"
          test -n "$INPUT"
          test "$(stat -c%s "$INPUT")" -gt 10000000
          echo "INPUT=$INPUT" >> "$GITHUB_ENV"
          ls -lh "$INPUT"

      - name: Validate downloaded reaction source
        run: |
          set -euxo pipefail
          ffprobe -v error \
            -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels \
            -of json "$INPUT" | tee source_probe.json
          python - <<'PY'
          import json
          data=json.load(open('source_probe.json',encoding='utf-8'))
          duration=float(data['format']['duration'])
          streams=data.get('streams',[])
          assert 2545 <= duration <= 2565, f'Unexpected source duration: {duration}'
          assert any(s.get('codec_type')=='video' for s in streams), 'No video stream'
          assert any(s.get('codec_type')=='audio' for s in streams), 'No audio stream'
          print(f'Validated source duration: {duration:.3f}s')
          PY
          ffmpeg -v error -i "$INPUT" -t 20 -f null -

      - name: Render the 38 exact keep segments
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          segments=[
            (400,418),(424,451),(467,470),(473,494),
            (518,553),(558,648),(691,696),(708,710),
            (726,734),(735,761),(772,799),(821,825),
            (826,871),(888,945),(985,998),(1005,1098),
            (1123,1126),(1139,1141),(1150,1164),(1167,1180),
            (1195,1214),(1235,1238),(1254,1270),(1291,1303),
            (1312,1314),(1325,1335),(1340,1344),(1346,1431),
            (1487,1503),(1509,1542),(1549,1575),(1584,1627),
            (1657,1661),(1671,1726),(1734,1783),(1799,1813),
            (1836,1859),(1883,2021),
          ]
          assert len(segments)==38
          assert sum(b-a for a,b in segments)==1058
          Path('segments.tsv').write_text('\n'.join(f'{i:02d}\t{a}\t{b}' for i,(a,b) in enumerate(segments)),encoding='utf-8')
          Path('middle_manifest.txt').write_text(
            'segments=38\nexpected_duration_seconds=1058\n'+
            '\n'.join(f'{i+1:02d}: {a}-{b} ({b-a}s)' for i,(a,b) in enumerate(segments))+'\n',encoding='utf-8')
          PY
          mkdir -p rendered_segments
          : > concat.txt
          while IFS=$'\t' read -r idx start end; do
            duration=$((end-start))
            ffmpeg -hide_banner -loglevel error -y \
              -ss "$start" -i "$INPUT" -t "$duration" \
              -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p" \
              -af "aresample=48000:async=1:first_pts=0,aformat=sample_fmts=fltp:sample_rates=48000:channel_layouts=stereo" \
              -c:v libx264 -preset veryfast -crf 18 -profile:v high -level 4.1 \
              -c:a aac -b:a 192k -ar 48000 -ac 2 \
              "rendered_segments/seg_${idx}.mp4"
            printf "file '%s'\n" "$PWD/rendered_segments/seg_${idx}.mp4" >> concat.txt
          done < segments.tsv
          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i concat.txt -c copy -movflags +faststart middle_clean.mp4
          ffprobe -v error \
            -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels \
            -of json middle_clean.mp4 | tee middle_probe.json
          python - <<'PY'
          import json
          data=json.load(open('middle_probe.json',encoding='utf-8'))
          duration=float(data['format']['duration'])
          assert 1057.4 <= duration <= 1059.0, f'Unexpected middle duration: {duration}'
          print(f'Validated clean middle duration: {duration:.3f}s')
          PY
          ffmpeg -v error -i middle_clean.mp4 -f null -
          sha256sum middle_clean.mp4 | tee middle_clean.sha256

      - name: Upload clean middle and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: christina-block-warp-middle-build
          path: |
            middle_clean.mp4
            middle_clean.sha256
            middle_probe.json
            middle_manifest.txt
            source_probe.json
            yt_dlp_download.log
            network_before.txt
            network_after.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
