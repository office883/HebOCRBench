name: Report canonical main tree SHA

on:
  pull_request:
    branches: [main]
    paths:
      - .github/main-tree-probe.json

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1
      - name: Record commit and tree identities
        shell: bash
        run: |
          set -euo pipefail
          {
            printf 'commit_sha=%s\n' "$(git rev-parse HEAD)"
            printf 'tree_sha=%s\n' "$(git rev-parse 'HEAD^{tree}')"
          } | tee "$RUNNER_TEMP/main-tree.txt"
      - name: Upload canonical tree identity
        uses: actions/upload-artifact@v4
        with:
          name: hebocrbench-main-tree
          path: ${{ runner.temp }}/main-tree.txt
          if-no-files-found: error
          retention-days: 1
