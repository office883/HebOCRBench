name: Apply verified Modern Hebrew corpus gate repair

on:
  push:
    branches:
      - agent/modern-corpus-gate-v1
    paths:
      - tools/modern-corpus-gate-v1.patch.b64.part*
      - .github/workflows/apply-modern-corpus-gate-v1.yml
  pull_request:
    branches:
      - main
    paths:
      - tools/modern-corpus-gate-v1.patch.b64.part*
      - .github/workflows/apply-modern-corpus-gate-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modern-corpus-gate-v1-${{ github.repository }}
  cancel-in-progress: true

jobs:
  apply-and-verify:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/modern-corpus-gate-v1
          fetch-depth: 0

      - name: Freeze remote branch identity
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          git fetch origin agent/modern-corpus-gate-v1
          test "$(git rev-parse origin/agent/modern-corpus-gate-v1)" = "$base"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-noto-core \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-heb

      - name: Reconstruct and probe audited patch
        id: patch
        continue-on-error: true
        shell: bash
        run: |
          set +e
          log="$RUNNER_TEMP/modern-corpus-gate-patch.log"
          status_file="$RUNNER_TEMP/modern-corpus-gate-patch.status"
          exec > >(tee "$log") 2>&1
          encoded="$RUNNER_TEMP/modern-corpus-gate-v1.patch.b64"
          patch="$RUNNER_TEMP/modern-corpus-gate-v1.patch"
          echo "branch_head=$(git rev-parse HEAD)"
          printf 'transport_parts=%s\n' "$(find tools -maxdepth 1 -name 'modern-corpus-gate-v1.patch.b64.part*' | wc -l)"
          cat tools/modern-corpus-gate-v1.patch.b64.part* > "$encoded"
          printf 'transport_chars=%s\n' "$(wc -c < "$encoded")"
          base64 --decode "$encoded" > "$patch"
          decode_status=$?
          echo "decode_status=$decode_status"
          sha256sum "$patch"
          printf '%s  %s\n' \
            '9542047be4e39fd2274f5d9db7e6e9724afceea2e45f26c9a2b7a599825a3e45' \
            "$patch" | sha256sum --check --strict
          hash_status=$?
          echo "hash_status=$hash_status"
          git apply --check --verbose "$patch"
          check_status=$?
          echo "apply_check_status=$check_status"
          if (( decode_status == 0 && hash_status == 0 && check_status == 0 )); then
            git apply --verbose "$patch"
            apply_status=$?
          else
            apply_status=99
          fi
          echo "apply_status=$apply_status"
          git diff --check
          diff_status=$?
          echo "diff_status=$diff_status"
          status=$(( decode_status || hash_status || check_status || apply_status || diff_status ))
          printf '%s\n' "$status" > "$status_file"
          exit 0

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: modern-corpus-gate-patch-diagnostics
          path: |
            ${{ runner.temp }}/modern-corpus-gate-patch.log
            ${{ runner.temp }}/modern-corpus-gate-patch.status
            ${{ runner.temp }}/modern-corpus-gate-v1.patch
          if-no-files-found: error
          retention-days: 7

      - name: Require successful patch application
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat "$RUNNER_TEMP/modern-corpus-gate-patch.status")" = '0'

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,bidi,corpus]'

      - name: Normalize and strictly verify Ruff
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check . --fix --exit-zero
          python -m ruff format .
          python -m ruff check .
          python -m ruff format --check .

      - name: Run focused corpus-gate regression tests
        run: |
          python -m pytest -q \
            tests/test_modern_pdf_agreement.py \
            tests/test_modern_public_materializer.py

      - name: Run complete test suite and runtime checks
        run: |
          python -m pytest -q
          python -m compileall -q src scripts
          hebocrbench tracks verify
          hebocrbench sanity \
            --output "$RUNNER_TEMP/hebocr-sanity" \
            --variants clean \
            --limit 28

      - name: Commit only verified source and regression tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HebOCRBench corpus gate'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            scripts/build_modern_public_corpus.py \
            src/hebocrbench/converters/modern_pdf.py \
            tests/test_modern_pdf_agreement.py \
            tests/test_modern_public_materializer.py
          git diff --cached --check
          git commit -m 'fix: validate modern PDF content without conflating region order'
          git fetch origin agent/modern-corpus-gate-v1
          remote="$(git rev-parse origin/agent/modern-corpus-gate-v1)"
          test "$remote" = "$BASE_SHA"
          git push \
            --force-with-lease=refs/heads/agent/modern-corpus-gate-v1:$BASE_SHA \
            origin HEAD:refs/heads/agent/modern-corpus-gate-v1
