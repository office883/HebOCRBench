name: Apply verified Modern Hebrew corpus gate repair

on:
  push:
    branches:
      - agent/modern-corpus-gate-v1
    paths:
      - tools/modern-corpus-gate-v1.patch.b64
      - .github/workflows/apply-modern-corpus-gate-v1.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: modern-corpus-gate-v1-${{ github.repository }}
  cancel-in-progress: false

jobs:
  apply-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out exact repair branch
        uses: actions/checkout@v4
        with:
          ref: agent/modern-corpus-gate-v1
          fetch-depth: 0

      - name: Freeze remote branch identity
        shell: bash
        run: |
          set -euo pipefail
          base="$(git rev-parse HEAD)"
          echo "BASE_SHA=$base" >> "$GITHUB_ENV"
          git fetch origin agent/modern-corpus-gate-v1
          test "$(git rev-parse origin/agent/modern-corpus-gate-v1)" = "$base"

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            fonts-noto-core \
            poppler-utils \
            tesseract-ocr \
            tesseract-ocr-eng \
            tesseract-ocr-heb

      - name: Reconstruct and apply audited patch
        shell: bash
        run: |
          set -euo pipefail
          patch="$RUNNER_TEMP/modern-corpus-gate-v1.patch"
          base64 --decode tools/modern-corpus-gate-v1.patch.b64 > "$patch"
          printf '%s  %s\n' \
            '9542047be4e39fd2274f5d9db7e6e9724afceea2e45f26c9a2b7a599825a3e45' \
            "$patch" | sha256sum --check --strict
          git apply --check "$patch"
          git apply "$patch"
          git diff --check

      - name: Install package and development dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e '.[dev,bidi,corpus]'

      - name: Normalize and strictly verify Ruff
        shell: bash
        run: |
          set -euo pipefail
          python -m ruff check . --fix --exit-zero
          python -m ruff format .
          python -m ruff check .
          python -m ruff format --check .

      - name: Run focused corpus-gate regression tests
        run: |
          python -m pytest -q \
            tests/test_modern_pdf_agreement.py \
            tests/test_modern_public_materializer.py

      - name: Run complete test suite and runtime checks
        run: |
          python -m pytest -q
          python -m compileall -q src scripts
          hebocrbench tracks verify
          hebocrbench sanity \
            --output "$RUNNER_TEMP/hebocr-sanity" \
            --variants clean \
            --limit 28

      - name: Commit only verified source and regression tests
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'HebOCRBench corpus gate'
          git config user.email 'actions@users.noreply.github.com'
          git add -- \
            scripts/build_modern_public_corpus.py \
            src/hebocrbench/converters/modern_pdf.py \
            tests/test_modern_pdf_agreement.py \
            tests/test_modern_public_materializer.py
          git diff --cached --check
          git commit -m 'fix: validate modern PDF content without conflating region order'
          git fetch origin agent/modern-corpus-gate-v1
          remote="$(git rev-parse origin/agent/modern-corpus-gate-v1)"
          test "$remote" = "$BASE_SHA"
          git push \
            --force-with-lease=refs/heads/agent/modern-corpus-gate-v1:$BASE_SHA \
            origin HEAD:refs/heads/agent/modern-corpus-gate-v1
