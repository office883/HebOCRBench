name: One-shot branch cleanup

on:
  push:
    branches: [main]
    paths:
      - .github/cleanup-branches-trigger
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: one-shot-branch-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out canonical main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - name: Delete every remote branch except main
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t branches < <(
            git ls-remote --heads origin |
              awk '{sub("refs/heads/", "", $2); print $2}' |
              LC_ALL=C sort
          )
          printf 'Branches before cleanup:\n'
          printf '  %s\n' "${branches[@]}"
          for branch in "${branches[@]}"; do
            [[ "$branch" == "main" ]] && continue
            git push origin --delete "$branch"
          done
          mapfile -t remaining < <(
            git ls-remote --heads origin |
              awk '{sub("refs/heads/", "", $2); print $2}' |
              LC_ALL=C sort
          )
          printf 'Branches after cleanup:\n'
          printf '  %s\n' "${remaining[@]}"
          [[ "${#remaining[@]}" -eq 1 ]]
          [[ "${remaining[0]}" == "main" ]]
