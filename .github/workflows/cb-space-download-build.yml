name: Temporary Christina Block Space download and middle build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cb-space-download-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-middle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install media and API tools
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --quiet --upgrade gradio_client huggingface_hub
          ffmpeg -version | head -n 3

      - name: Download reaction video through public Gradio endpoint
        run: |
          set -euxo pipefail
          cat > /tmp/download_space.py <<'PY'
          from __future__ import annotations
          import json
          import os
          import pathlib
          import shutil
          import traceback
          from gradio_client import Client

          URL = 'https://www.youtube.com/watch?v=HOW33afxE6g'
          SPACE = 'prasanthntu/youtube-downloader'
          result_doc = {'space': SPACE, 'url': URL}
          try:
              client = Client(SPACE, verbose=True)
              job = client.submit(URL, 'video', 'medium', api_name='/download_for_browser')
              result = job.result(timeout=4200)
              result_doc['raw_result'] = repr(result)
              print('GRADIO RESULT:', repr(result), flush=True)
              if not isinstance(result, (list, tuple)) or len(result) < 2:
                  raise RuntimeError(f'Unexpected Gradio result: {result!r}')
              status, file_value = result[0], result[1]
              result_doc['status'] = str(status)
              result_doc['file_value'] = repr(file_value)
              if not file_value:
                  raise RuntimeError(f'Space did not return a file. Status: {status}')
              source = pathlib.Path(str(file_value))
              if not source.exists():
                  raise FileNotFoundError(f'Gradio output path does not exist: {source}')
              if source.stat().st_size < 10_000_000:
                  raise RuntimeError(f'Gradio output is too small: {source.stat().st_size} bytes')
              suffix = source.suffix or '.bin'
              dest = pathlib.Path('reaction_source' + suffix)
              shutil.copy2(source, dest)
              result_doc['copied_to'] = str(dest)
              result_doc['bytes'] = dest.stat().st_size
              pathlib.Path('space_result.json').write_text(json.dumps(result_doc, ensure_ascii=False, indent=2), encoding='utf-8')
          except Exception:
              result_doc['error'] = traceback.format_exc()
              pathlib.Path('space_result.json').write_text(json.dumps(result_doc, ensure_ascii=False, indent=2), encoding='utf-8')
              print(result_doc['error'], flush=True)
              raise
          PY
          python /tmp/download_space.py
          INPUT="$(find . -maxdepth 1 -type f -name 'reaction_source*' | head -n 1)"
          test -n "$INPUT"
          echo "INPUT=$INPUT" >> "$GITHUB_ENV"
          ls -lh "$INPUT" space_result.json

      - name: Validate source media
        run: |
          set -euxo pipefail
          ffprobe -v error \
            -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels \
            -of json "$INPUT" | tee source_probe.json
          python - <<'PY'
          import json
          data=json.load(open('source_probe.json',encoding='utf-8'))
          duration=float(data['format']['duration'])
          streams=data.get('streams',[])
          assert 2545 <= duration <= 2565, f'Unexpected source duration: {duration}'
          assert any(s.get('codec_type')=='video' for s in streams), 'No video stream'
          assert any(s.get('codec_type')=='audio' for s in streams), 'No audio stream'
          print(f'Validated source duration: {duration:.3f}s')
          PY
          ffmpeg -v error -i "$INPUT" -t 15 -f null -

      - name: Build exact keep-list filter
        run: |
          python - <<'PY'
          segments = [
              (400, 418), (424, 451), (467, 470), (473, 494),
              (518, 553), (558, 648), (691, 696), (708, 710),
              (726, 734), (735, 761), (772, 799), (821, 825),
              (826, 871), (888, 945), (985, 998), (1005, 1098),
              (1123, 1126), (1139, 1141), (1150, 1164), (1167, 1180),
              (1195, 1214), (1235, 1238), (1254, 1270), (1291, 1303),
              (1312, 1314), (1325, 1335), (1340, 1344), (1346, 1431),
              (1487, 1503), (1509, 1542), (1549, 1575), (1584, 1627),
              (1657, 1661), (1671, 1726), (1734, 1783), (1799, 1813),
              (1836, 1859), (1883, 2021),
          ]
          expected=sum(b-a for a,b in segments)
          assert expected == 1058
          chains=[]
          for i,(start,end) in enumerate(segments):
              chains.append(
                  f'[0:v:0]trim=start={start}:end={end},setpts=PTS-STARTPTS,'
                  'scale=1280:720:force_original_aspect_ratio=decrease,'
                  'pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p'
                  f'[v{i}]'
              )
              chains.append(
                  f'[0:a:0]atrim=start={start}:end={end},asetpts=PTS-STARTPTS,'
                  'aresample=48000:async=1:first_pts=0,'
                  'aformat=sample_fmts=fltp:sample_rates=48000:channel_layouts=stereo'
                  f'[a{i}]'
              )
          concat=''.join(f'[v{i}][a{i}]' for i in range(len(segments)))
          chains.append(f'{concat}concat=n={len(segments)}:v=1:a=1[vout][aout]')
          open('filter_complex.txt','w',encoding='utf-8').write(';\n'.join(chains))
          with open('middle_manifest.txt','w',encoding='utf-8') as f:
              f.write(f'segments={len(segments)}\nexpected_duration_seconds={expected}\n')
              for i,(a,b) in enumerate(segments,1):
                  f.write(f'{i:02d}: {a}-{b} ({b-a}s)\n')
          PY

      - name: Render clean middle
        run: |
          set -euxo pipefail
          ffmpeg -hide_banner -y -i "$INPUT" \
            -filter_complex_script filter_complex.txt \
            -map '[vout]' -map '[aout]' \
            -c:v libx264 -preset veryfast -crf 18 -profile:v high -level 4.1 \
            -c:a aac -b:a 192k -ar 48000 -ac 2 \
            -movflags +faststart middle_clean.mp4
          ffprobe -v error \
            -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels \
            -of json middle_clean.mp4 | tee middle_probe.json
          python - <<'PY'
          import json
          data=json.load(open('middle_probe.json',encoding='utf-8'))
          duration=float(data['format']['duration'])
          assert 1057.4 <= duration <= 1058.6, f'Unexpected middle duration: {duration}'
          print(f'Validated middle duration: {duration:.3f}s')
          PY
          ffmpeg -v error -i middle_clean.mp4 -f null -
          sha256sum middle_clean.mp4 | tee middle_clean.sha256

      - name: Upload clean middle artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: christina-block-space-middle-build
          path: |
            middle_clean.mp4
            middle_clean.sha256
            middle_probe.json
            middle_manifest.txt
            source_probe.json
            space_result.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
