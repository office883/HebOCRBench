name: Temporary Christina Block direct Cobalt build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cb-cobalt-direct.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install media tools
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg ca-certificates
          python -m pip install --quiet --upgrade requests urllib3

      - name: Resolve and download through direct Cobalt APIs
        run: |
          set -euxo pipefail
          cat > /tmp/direct_cobalt.py <<'PY'
          from __future__ import annotations
          import hashlib
          import json
          import os
          import pathlib
          import re
          import shutil
          import subprocess
          import sys
          import time
          import traceback
          from urllib.parse import urljoin, urlparse

          import requests
          import urllib3
          urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

          VIDEO='https://www.youtube.com/watch?v=HOW33afxE6g'
          UA='cb-video-editor/2026.08 (+https://github.com/office883/HebOCRBench)'
          OUT=pathlib.Path('cobalt_direct')
          OUT.mkdir(exist_ok=True)
          REPORT={'video':VIDEO,'attempts':[]}
          S=requests.Session()
          S.headers.update({'User-Agent':UA,'Accept':'application/json, */*'})

          static=[
            'https://cobalt-api.meowing.de',
            'https://capi.3kh0.net',
            'https://cobalt-backend.canine.tools',
            'https://kityune.imput.net',
            'https://nachos.imput.net',
            'https://sunny.imput.net',
            'https://blossom.imput.net',
          ]

          def normalized(base:str)->str:
              return base.rstrip('/')

          candidates=[]
          for list_url in [
              'https://instances.cobalt.best/instances.json',
              'https://instances.cobalt.best/api/instances.json',
          ]:
              try:
                  r=S.get(list_url,timeout=(15,60),verify=False)
                  REPORT.setdefault('instance_lists',[]).append({'url':list_url,'status':r.status_code,'bytes':len(r.content),'prefix':r.text[:300]})
                  if r.status_code==200:
                      data=r.json()
                      for row in data:
                          services=row.get('services') or {}
                          info=row.get('info') or {}
                          if not row.get('online',True): continue
                          if services.get('youtube') is not True: continue
                          if info.get('auth') is True: continue
                          api=row.get('api') or row.get('api_url')
                          if not api: continue
                          proto=row.get('protocol') or 'https'
                          if not api.startswith('http'):
                              api=f'{proto}://{api}'
                          candidates.append(api)
              except Exception:
                  REPORT.setdefault('instance_lists',[]).append({'url':list_url,'error':traceback.format_exc()})

          candidates=static+candidates
          seen=set(); candidates=[normalized(x) for x in candidates if not (normalized(x) in seen or seen.add(normalized(x)))]
          REPORT['candidates']=candidates
          print('CANDIDATES',candidates,flush=True)

          body_variants=[
            {
              'url':VIDEO,
              'videoQuality':'720',
              'downloadMode':'auto',
              'youtubeVideoCodec':'h264',
              'filenameStyle':'basic',
              'alwaysProxy':True,
              'disableMetadata':False,
            },
            {
              'url':VIDEO,
              'videoQuality':'720',
              'downloadMode':'auto',
              'youtubeVideoCodec':'h264',
              'filenameStyle':'basic',
            },
            {'url':VIDEO},
          ]

          def safe_url(u):
              try:
                  p=urlparse(u)
                  return {'scheme':p.scheme,'host':p.netloc,'path':p.path[:160],'query_len':len(p.query)}
              except Exception:
                  return str(u)[:300]

          def download_url(url:str, dest:pathlib.Path, headers:dict|None=None)->dict:
              rec={'url':safe_url(url)}
              h={'User-Agent':UA,'Accept':'*/*'}
              if headers: h.update(headers)
              with S.get(url,headers=h,stream=True,allow_redirects=True,timeout=(25,1800),verify=False) as r:
                  rec.update(status=r.status_code,final_url=safe_url(r.url),content_type=r.headers.get('content-type'),content_length=r.headers.get('content-length'),content_disposition=r.headers.get('content-disposition'))
                  r.raise_for_status()
                  size=0
                  with dest.open('wb') as f:
                      for chunk in r.iter_content(1024*1024):
                          if not chunk: continue
                          f.write(chunk); size+=len(chunk)
                          if size%(25*1024*1024)<1024*1024: print('DOWNLOADED',size,'bytes from',rec['final_url'],flush=True)
                  rec['bytes']=size
              return rec

          def validate(path:pathlib.Path)->dict:
              p=subprocess.run([
                'ffprobe','-v','error','-show_entries',
                'format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels',
                '-of','json',str(path)
              ],stdout=subprocess.PIPE,stderr=subprocess.STDOUT,text=True,timeout=180)
              rec={'returncode':p.returncode,'output':p.stdout[:20000]}
              if p.returncode==0:
                  data=json.loads(p.stdout); rec['probe']=data
                  duration=float(data.get('format',{}).get('duration') or 0)
                  streams=data.get('streams',[])
                  rec['duration']=duration
                  rec['valid']=2545<=duration<=2565 and any(s.get('codec_type')=='video' for s in streams) and any(s.get('codec_type')=='audio' for s in streams)
              else: rec['valid']=False
              return rec

          source=None
          for ci,base in enumerate(candidates):
              for bi,body in enumerate(body_variants):
                  attempt={'base':base,'body_variant':bi+1,'body':body}
                  REPORT['attempts'].append(attempt)
                  try:
                      print('\nTRY',base,'variant',bi+1,flush=True)
                      r=S.post(base+'/',json=body,headers={'Content-Type':'application/json','Accept':'application/json','User-Agent':UA},timeout=(20,180),verify=False,allow_redirects=True)
                      attempt.update(http_status=r.status_code,response_type=r.headers.get('content-type'),response_prefix=r.text[:2000])
                      print('RESPONSE',r.status_code,r.text[:1000],flush=True)
                      if r.status_code not in (200,201): continue
                      data=r.json(); attempt['response']=data
                      status=data.get('status')
                      urls=[]
                      if status in ('tunnel','redirect') and data.get('url'):
                          urls.append(('single',data['url']))
                      elif status=='picker':
                          for i,item in enumerate(data.get('picker') or []):
                              if isinstance(item,dict) and item.get('url'): urls.append((f'picker_{i}',item['url']))
                      elif status=='local-processing':
                          # Newer Cobalt responses may expose tunnel URLs in nested media objects.
                          def walk(x,path='root'):
                              if isinstance(x,dict):
                                  for k,v in x.items():
                                      if k=='url' and isinstance(v,str) and v.startswith('http'): urls.append((path+'.'+k,v))
                                      else: walk(v,path+'.'+str(k))
                              elif isinstance(x,list):
                                  for i,v in enumerate(x): walk(v,path+f'[{i}]')
                          walk(data)
                      if not urls: continue
                      for ui,(label,url) in enumerate(urls):
                          ext='.mp4'
                          filename=str(data.get('filename') or '')
                          suffix=pathlib.Path(filename).suffix
                          if suffix: ext=suffix
                          dest=OUT/f'candidate_{ci:02d}_{bi:02d}_{ui:02d}{ext}'
                          try:
                              dl=download_url(url,dest)
                              attempt.setdefault('downloads',[]).append({'label':label,**dl})
                              if dest.stat().st_size<10_000_000:
                                  continue
                              val=validate(dest); attempt['downloads'][-1]['validation']=val
                              print('VALIDATION',val,flush=True)
                              if val.get('valid'):
                                  source=dest
                                  break
                          except Exception:
                              attempt.setdefault('downloads',[]).append({'label':label,'error':traceback.format_exc()})
                      if source: break
                  except Exception:
                      attempt['error']=traceback.format_exc()
                      print(attempt['error'],flush=True)
              if source: break

          pathlib.Path('cobalt_direct_report.json').write_text(json.dumps(REPORT,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
          if not source:
              raise SystemExit('No direct Cobalt instance yielded a valid full reaction video')
          dest=pathlib.Path('reaction_source'+(source.suffix or '.mp4'))
          shutil.copy2(source,dest)
          pathlib.Path('source_path.txt').write_text(str(dest),encoding='utf-8')
          print('SUCCESS SOURCE',dest,dest.stat().st_size,flush=True)
          PY
          python /tmp/direct_cobalt.py 2>&1 | tee cobalt_direct.log
          INPUT="$(cat source_path.txt)"
          echo "INPUT=$INPUT" >> "$GITHUB_ENV"
          ls -lh "$INPUT" cobalt_direct_report.json cobalt_direct.log

      - name: Render 38 exact middle segments
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          segments=[
            (400,418),(424,451),(467,470),(473,494),
            (518,553),(558,648),(691,696),(708,710),
            (726,734),(735,761),(772,799),(821,825),
            (826,871),(888,945),(985,998),(1005,1098),
            (1123,1126),(1139,1141),(1150,1164),(1167,1180),
            (1195,1214),(1235,1238),(1254,1270),(1291,1303),
            (1312,1314),(1325,1335),(1340,1344),(1346,1431),
            (1487,1503),(1509,1542),(1549,1575),(1584,1627),
            (1657,1661),(1671,1726),(1734,1783),(1799,1813),
            (1836,1859),(1883,2021),
          ]
          assert sum(b-a for a,b in segments)==1058
          Path('segments.tsv').write_text('\n'.join(f'{i:02d}\t{a}\t{b}' for i,(a,b) in enumerate(segments)),encoding='utf-8')
          Path('middle_manifest.txt').write_text('segments=38\nexpected_duration_seconds=1058\n'+'\n'.join(f'{i+1:02d}: {a}-{b} ({b-a}s)' for i,(a,b) in enumerate(segments))+'\n',encoding='utf-8')
          PY
          mkdir -p rendered_segments
          : > concat.txt
          while IFS=$'\t' read -r idx start end; do
            duration=$((end-start))
            ffmpeg -hide_banner -loglevel error -y -ss "$start" -i "$INPUT" -t "$duration" \
              -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p" \
              -af "aresample=48000:async=1:first_pts=0,aformat=sample_fmts=fltp:sample_rates=48000:channel_layouts=stereo" \
              -c:v libx264 -preset veryfast -crf 18 -profile:v high -level 4.1 \
              -c:a aac -b:a 192k -ar 48000 -ac 2 "rendered_segments/seg_${idx}.mp4"
            printf "file '%s'\n" "$PWD/rendered_segments/seg_${idx}.mp4" >> concat.txt
          done < segments.tsv
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i concat.txt -c copy -movflags +faststart middle_clean.mp4
          ffprobe -v error -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels -of json middle_clean.mp4 | tee middle_probe.json
          python - <<'PY'
          import json
          d=json.load(open('middle_probe.json',encoding='utf-8'))
          duration=float(d['format']['duration'])
          assert 1057.4<=duration<=1059.0,duration
          print(f'Validated middle duration: {duration:.3f}s')
          PY
          ffmpeg -v error -i middle_clean.mp4 -f null -
          sha256sum middle_clean.mp4 | tee middle_clean.sha256

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: christina-block-cobalt-direct-build
          path: |
            middle_clean.mp4
            middle_clean.sha256
            middle_probe.json
            middle_manifest.txt
            cobalt_direct_report.json
            cobalt_direct.log
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
