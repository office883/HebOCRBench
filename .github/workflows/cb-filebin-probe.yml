name: Temporary Christina Block Filebin status

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cb-filebin-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Inspect remote status, error, and final file
        run: |
          set -euo pipefail
          BASE='https://filebin.net/ricivzzx58ygduk3'
          echo '--- STATUS ---'
          if curl -fsSL --connect-timeout 15 --max-time 60 "$BASE/cb_middle_a7f4c9_status.txt" -o status.txt; then
            cat status.txt
          else
            echo 'status file not present'
          fi
          echo '--- ERROR ---'
          if curl -fsSL --connect-timeout 15 --max-time 60 "$BASE/cb_middle_a7f4c9_error.txt" -o error.txt; then
            cat error.txt
            exit 2
          else
            echo 'error file not present'
          fi
          echo '--- FINAL HEADERS ---'
          curl -sSIL --connect-timeout 15 --max-time 60 "$BASE/cb_middle_a7f4c9.mp4" || true
