name: Temporary Christina Block yt-dlp diagnostics relay

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cb-filebin-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for diagnostic report
        run: |
          set -euo pipefail
          URL='https://filebin.net/ricivzzx58ygduk3/cb_diag_a7f4c9_b1.txt'
          found=0
          for attempt in $(seq 1 90); do
            if curl -fL --connect-timeout 15 --max-time 180 "$URL" -o yt_dlp_diagnostic.txt 2>/dev/null; then
              found=1
              break
            fi
            echo "Waiting for diagnostic report ($attempt/90)..."
            sleep 10
          done
          test "$found" -eq 1 || { echo 'Diagnostic report did not arrive'; exit 1; }
          wc -c yt_dlp_diagnostic.txt
          sha256sum yt_dlp_diagnostic.txt
          cat yt_dlp_diagnostic.txt
      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: cb-yt-dlp-diagnostic-a7f4c9-b1
          path: yt_dlp_diagnostic.txt
          retention-days: 1
          if-no-files-found: error
