name: Temporary YouTube metadata lookup

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-youtube-oembed-title.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch metadata
        run: |
          set -euxo pipefail
          curl -fL --retry 5 --connect-timeout 20 --max-time 120 \
            'https://www.youtube.com/oembed?url=https%3A%2F%2Fwww.youtube.com%2Fwatch%3Fv%3DHOW33afxE6g&format=json' \
            -o youtube_oembed.json
          python -m json.tool youtube_oembed.json | tee youtube_oembed_pretty.json
      - name: Upload metadata
        uses: actions/upload-artifact@v4
        with:
          name: youtube-oembed-HOW33afxE6g
          path: youtube_oembed_pretty.json
          retention-days: 1
