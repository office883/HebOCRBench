name: Temporary Christina Block Cobalt middle build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cb-pybalt-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-middle:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Install pinned Cobalt client and media tools
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg git
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet 'git+https://github.com/nichind/pybalt.git@af656b636046f36722ffecc1782f994a10783b79'
          python - <<'PY'
          import pybalt
          print('pybalt', pybalt.VERSION)
          PY
          ffmpeg -version | head -n 3

      - name: Download reaction through rotating Cobalt instances
        run: |
          set -euxo pipefail
          mkdir -p cobalt_download
          cat > /tmp/cobalt_download.py <<'PY'
          from __future__ import annotations
          import asyncio
          import json
          import pathlib
          import shutil
          import traceback
          from pybalt import manager

          URL='https://www.youtube.com/watch?v=HOW33afxE6g'
          OUT=pathlib.Path('cobalt_download')
          OUT.mkdir(exist_ok=True)
          report={'url':URL}

          async def main():
              instances=await manager.fetch_instances(min_score=0,filter_online=True)
              report['instances']=[{
                  'api_url':i.api_url,
                  'score':i.score,
                  'trust':i.trust,
                  'youtube':i.services.get('youtube') if getattr(i,'services',None) else None,
              } for i in instances]
              print(f'Fetched {len(instances)} public Cobalt instances',flush=True)
              for row in report['instances'][:60]:
                  print(row,flush=True)

              result=await manager.download(
                  url=URL,
                  filenameStyle='basic',
                  videoQuality='720',
                  downloadMode='auto',
                  youtubeVideoCodec='h264',
                  alwaysProxy=True,
                  disableMetadata=False,
                  only_path=False,
                  remux=False,
                  min_file_size=10_000_000,
                  max_retries=30,
                  folder_path=OUT,
              )
              report['raw_result']=repr(result)
              print('DOWNLOAD RESULT',repr(result),flush=True)
              path=None
              error=None
              if isinstance(result,tuple) and len(result)>=3:
                  path=result[1]; error=result[2]
              elif isinstance(result,pathlib.Path):
                  path=result
              elif isinstance(result,str):
                  path=pathlib.Path(result)
              elif isinstance(result,list):
                  # Single URL can occasionally be wrapped in a list.
                  if len(result)==3 and isinstance(result[0],str):
                      path=result[1]; error=result[2]
                  elif len(result)==1:
                      item=result[0]
                      if isinstance(item,tuple) and len(item)>=3:
                          path=item[1]; error=item[2]
                      else:
                          path=item
              if error is not None:
                  raise RuntimeError(f'Cobalt download returned an error: {error!r}')
              if isinstance(path,list):
                  candidates=[pathlib.Path(p) for p in path]
                  path=max(candidates,key=lambda p:p.stat().st_size)
              if path is None:
                  raise RuntimeError(f'Cobalt did not return a path: {result!r}')
              path=pathlib.Path(path)
              if not path.exists():
                  raise FileNotFoundError(path)
              if path.stat().st_size<10_000_000:
                  raise RuntimeError(f'Download too small: {path.stat().st_size}')
              suffix=path.suffix or '.bin'
              dest=pathlib.Path('reaction_source'+suffix)
              shutil.copy2(path,dest)
              report['source']=str(path)
              report['copied_to']=str(dest)
              report['bytes']=dest.stat().st_size

          try:
              asyncio.run(main())
          except Exception:
              report['error']=traceback.format_exc()
              print(report['error'],flush=True)
              raise
          finally:
              pathlib.Path('cobalt_result.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/cobalt_download.py 2>&1 | tee cobalt_download.log
          INPUT="$(find . -maxdepth 1 -type f -name 'reaction_source*' | head -n 1)"
          test -n "$INPUT"
          echo "INPUT=$INPUT" >> "$GITHUB_ENV"
          ls -lh "$INPUT" cobalt_result.json cobalt_download.log

      - name: Validate reaction source
        run: |
          set -euxo pipefail
          ffprobe -v error \
            -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels \
            -of json "$INPUT" | tee source_probe.json
          python - <<'PY'
          import json
          data=json.load(open('source_probe.json',encoding='utf-8'))
          duration=float(data['format']['duration'])
          streams=data.get('streams',[])
          assert 2545 <= duration <= 2565, f'Unexpected source duration: {duration}'
          assert any(s.get('codec_type')=='video' for s in streams), 'No video stream'
          assert any(s.get('codec_type')=='audio' for s in streams), 'No audio stream'
          print(f'Validated source duration: {duration:.3f}s')
          PY
          ffmpeg -v error -i "$INPUT" -t 15 -f null -

      - name: Build exact keep-list filter
        run: |
          python - <<'PY'
          segments=[
            (400,418),(424,451),(467,470),(473,494),
            (518,553),(558,648),(691,696),(708,710),
            (726,734),(735,761),(772,799),(821,825),
            (826,871),(888,945),(985,998),(1005,1098),
            (1123,1126),(1139,1141),(1150,1164),(1167,1180),
            (1195,1214),(1235,1238),(1254,1270),(1291,1303),
            (1312,1314),(1325,1335),(1340,1344),(1346,1431),
            (1487,1503),(1509,1542),(1549,1575),(1584,1627),
            (1657,1661),(1671,1726),(1734,1783),(1799,1813),
            (1836,1859),(1883,2021),
          ]
          expected=sum(b-a for a,b in segments)
          assert expected==1058
          chains=[]
          for i,(a,b) in enumerate(segments):
            chains.append(
              f'[0:v:0]trim=start={a}:end={b},setpts=PTS-STARTPTS,'
              'scale=1280:720:force_original_aspect_ratio=decrease,'
              'pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p'
              f'[v{i}]'
            )
            chains.append(
              f'[0:a:0]atrim=start={a}:end={b},asetpts=PTS-STARTPTS,'
              'aresample=48000:async=1:first_pts=0,'
              'aformat=sample_fmts=fltp:sample_rates=48000:channel_layouts=stereo'
              f'[a{i}]'
            )
          inputs=''.join(f'[v{i}][a{i}]' for i in range(len(segments)))
          chains.append(f'{inputs}concat=n={len(segments)}:v=1:a=1[vout][aout]')
          open('filter_complex.txt','w',encoding='utf-8').write(';\n'.join(chains))
          with open('middle_manifest.txt','w',encoding='utf-8') as f:
            f.write(f'segments={len(segments)}\nexpected_duration_seconds={expected}\n')
            for i,(a,b) in enumerate(segments,1): f.write(f'{i:02d}: {a}-{b} ({b-a}s)\n')
          PY

      - name: Render and validate clean middle
        run: |
          set -euxo pipefail
          ffmpeg -hide_banner -y -i "$INPUT" \
            -filter_complex_script filter_complex.txt \
            -map '[vout]' -map '[aout]' \
            -c:v libx264 -preset veryfast -crf 18 -profile:v high -level 4.1 \
            -c:a aac -b:a 192k -ar 48000 -ac 2 \
            -movflags +faststart middle_clean.mp4
          ffprobe -v error \
            -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels \
            -of json middle_clean.mp4 | tee middle_probe.json
          python - <<'PY'
          import json
          d=json.load(open('middle_probe.json',encoding='utf-8'))
          duration=float(d['format']['duration'])
          assert 1057.4 <= duration <= 1058.6, duration
          print(f'Validated clean middle: {duration:.3f}s')
          PY
          ffmpeg -v error -i middle_clean.mp4 -f null -
          sha256sum middle_clean.mp4 | tee middle_clean.sha256

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: christina-block-cobalt-middle-build
          path: |
            middle_clean.mp4
            middle_clean.sha256
            middle_probe.json
            middle_manifest.txt
            source_probe.json
            cobalt_result.json
            cobalt_download.log
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
