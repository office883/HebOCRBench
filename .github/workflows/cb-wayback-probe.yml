name: Temporary Christina Block Wayback media probe

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cb-wayback-probe.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Fetch archived watch page and inspect player data
        run: |
          set -euxo pipefail
          python -m pip install --quiet requests
          cat > /tmp/wayback_probe.py <<'PY'
          from __future__ import annotations
          import json, pathlib, re, requests, traceback
          from urllib.parse import unquote

          ts='20250912203441'
          original='https://www.youtube.com/watch?app=desktop&v=y-NQIT1Oppw'
          urls={
            'rewritten':f'https://web.archive.org/web/{ts}/{original}',
            'identity':f'https://web.archive.org/web/{ts}id_/{original}',
            'javascript':f'https://web.archive.org/web/{ts}js_/{original}',
            'cdx_exact':'https://web.archive.org/cdx/search/cdx?url=www.youtube.com/watch%3Fapp%3Ddesktop%26v%3Dy-NQIT1Oppw&output=json&fl=timestamp,original,mimetype,statuscode,digest,length&filter=statuscode:200',
            'cdx_id':'https://web.archive.org/cdx/search/cdx?url=*y-NQIT1Oppw*&output=json&fl=timestamp,original,mimetype,statuscode,digest,length&filter=statuscode:200&collapse=urlkey&limit=500',
          }
          s=requests.Session(); s.headers['User-Agent']='Mozilla/5.0 Chrome/140 Safari/537.36'
          report={}
          out=pathlib.Path('wayback_probe'); out.mkdir(exist_ok=True)
          for name,url in urls.items():
            rec={'url':url}
            try:
              r=s.get(url,timeout=(20,180),allow_redirects=True)
              rec.update(status=r.status_code,final_url=r.url,content_type=r.headers.get('content-type'),bytes=len(r.content))
              dest=out/f'{name}.bin'; dest.write_bytes(r.content)
              text=r.text
              rec['prefix']=text[:500]
              rec['markers']={m:text.find(m) for m in [
                'ytInitialPlayerResponse','streamingData','adaptiveFormats','formats','googlevideo.com','videoplayback','player_response','playabilityStatus','LOGIN_REQUIRED','UNPLAYABLE','This video is unavailable'
              ]}
              rec['youtube_ids']=sorted(set(re.findall(r'[A-Za-z0-9_-]{11}',text)))[:100]
              rec['googlevideo_urls']=re.findall(r'https?[^"\\\s]+googlevideo[^"\\\s]+',text)[:20]
              rec['videoplayback_fragments']=re.findall(r'https?[^"\\\s]+videoplayback[^"\\\s]+',text)[:20]
              # Save context around high-value markers.
              contexts=[]
              for marker,pos in rec['markers'].items():
                if pos>=0:
                  contexts.append(f'\n===== {marker} @ {pos} =====\n'+text[max(0,pos-1000):pos+5000])
              (out/f'{name}_contexts.txt').write_text('\n'.join(contexts),encoding='utf-8',errors='replace')
            except Exception:
              rec['error']=traceback.format_exc()
            report[name]=rec
            print(name,json.dumps(rec,ensure_ascii=False,indent=2),flush=True)
          (out/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
          python /tmp/wayback_probe.py | tee wayback_probe.log

      - name: Upload probe
        uses: actions/upload-artifact@v4
        with:
          name: cb-wayback-probe
          path: |
            wayback_probe/
            wayback_probe.log
          retention-days: 1
          if-no-files-found: error
