            --proto '=https' --proto-redir '=https' \
            "$NOTO_HEBREW_URL" --output "$font"
          printf '%s  %s\n' "$NOTO_HEBREW_SHA256" "$font" | sha256sum --check --strict
          python - "$font" "$RUNNER_TEMP/build-environment.json" <<'PY'
          from importlib.metadata import version
          import hashlib
          import json
          import os
          from pathlib import Path
          import platform
          import subprocess
          import sys

          font = Path(sys.argv[1])
          poppler = subprocess.run(
              ["pdftotext", "-v"], capture_output=True, check=False, text=True
          )
          assert poppler.returncode == 0
          payload = {
              "schema_version": "1.0",
              "source_commit": os.environ["GITHUB_SHA"],
              "runner_os": os.environ.get("RUNNER_OS"),
              "python": platform.python_version(),
              "platform": platform.platform(),
              "packages": {
                  name: version(name)
                  for name in (
                      "jsonschema",
                      "numpy",
                      "Pillow",
                      "PyMuPDF",
                      "PyYAML",
                      "pyarrow",
                      "python-bidi",
                      "rapidfuzz",
                      "referencing",
                      "regex",
                      "scipy",
                      "shapely",
                  )
              },
              "pdftotext_version": (poppler.stderr or poppler.stdout).strip(),
              "diagnostic_font_sha256": hashlib.sha256(font.read_bytes()).hexdigest(),
              "selection_sha256": os.environ["SELECTION_SHA256"],
              "effective_selection_sha256": os.environ["EFFECTIVE_SELECTION_SHA256"],
          }
          Path(sys.argv[2]).write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY

