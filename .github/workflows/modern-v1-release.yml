            --component-root "rashi-print-synthetic-diagnostic-v1=$RUNNER_TEMP/extension-roots/rashi-print-synthetic-diagnostic-v1" \
            --clean
          python - "$release/HebOCRBench-v1.0.0-release-manifest.json" \
            "$RUNNER_TEMP/modern-suite-v1.lock.json" \
            "$RUNNER_TEMP/full-suite-v1.lock.json" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          manifest = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          modern_suite = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          full_suite = json.loads(Path(sys.argv[3]).read_text(encoding="utf-8"))
          assert manifest["modern_suite_fingerprint"] == modern_suite["suite_fingerprint"]
          assert manifest["full_suite_fingerprint"] == full_suite["suite_fingerprint"]
          assert manifest["modern_suite_fingerprint"] == os.environ["MODERN_SUITE_FINGERPRINT"]
          assert manifest["full_suite_fingerprint"] == os.environ["FULL_SUITE_FINGERPRINT"]
          assert set(manifest["headline_tracks"]) == set(modern_suite["tracks"])
          certified = sorted(
              component_id
              for component_id, component in full_suite["components"].items()
              if component["status"] == "certified"
          )
          assert manifest["certified_components"] == certified
          assert len(certified) == 10
          assert manifest["all_certified_component_roots_verified"] is True
          non_modern_profiles = [
              value
              for value in manifest["official_profiles"]
              if not str(value).startswith("modern-")
          ]
          if non_modern_profiles:
              assert manifest["scope"] != "modern-hebrew-only", (
                  "release manifest claims modern-only scope while publishing "
                  f"non-modern profiles: {non_modern_profiles}"
              )
          PY
          cd "$release"
          sha256sum --check --strict HebOCRBench-v1.0.0-SHA256SUMS.txt
          cd "$GITHUB_WORKSPACE"
          python scripts/verify_v1_release.py \
            --root "$GITHUB_WORKSPACE" \
            --release-dir "$release" \
            --manifest "$release/HebOCRBench-v1.0.0-release-manifest.json" \
            --component-root "modern-bidi-v1=$RUNNER_TEMP/roots/modern-bidi-v1" \
            --component-root "modern-line-recognition-v1=$RUNNER_TEMP/evaluation-roots/modern-line-recognition-v1" \
            --component-root "modern-page-ocr-v1=$RUNNER_TEMP/evaluation-roots/modern-page-ocr-v1" \
            --component-root "modern-tables-v1=$RUNNER_TEMP/evaluation-roots/modern-tables-v1" \
            --component-root "modern-robustness-v1=$RUNNER_TEMP/evaluation-roots/modern-robustness-v1" \
            --component-root "modern-handwriting-v1=$RUNNER_TEMP/extension-roots/modern-handwriting-v1" \
            --component-root "historical-pinkas-handwriting-v1=$RUNNER_TEMP/extension-roots/historical-pinkas-handwriting-v1" \
            --component-root "historical-hebrew-press-mixed-v1=$RUNNER_TEMP/extension-roots/historical-hebrew-press-mixed-v1" \
            --component-root "biblical-niqqud-synthetic-diagnostic-v1=$RUNNER_TEMP/extension-roots/biblical-niqqud-synthetic-diagnostic-v1" \
            --component-root "rashi-print-synthetic-diagnostic-v1=$RUNNER_TEMP/extension-roots/rashi-print-synthetic-diagnostic-v1" \
            --report "$release/HebOCRBench-v1.0.0-verification.json" \
            --skip-tests
          cd "$release"
          sha256sum HebOCRBench-v1.0.0-verification.json \
            > HebOCRBench-v1.0.0-verification.json.sha256

      - name: Write non-redistributive certification proof bundle
        shell: bash
        run: |
          set -euo pipefail
          proof="$RUNNER_TEMP/certification-proof"
          mkdir -p "$proof/tracks"
          cp "$RUNNER_TEMP/modern-suite-v1.lock.json" "$proof/"
          cp "$RUNNER_TEMP/full-suite-v1.lock.json" "$proof/"
          cp "$RUNNER_TEMP/release/HebOCRBench-v1.0.0-component-proof.json" "$proof/"
          cp "$RUNNER_TEMP/sources/modern-public-documents-v1/evidence/summary.json" \
            "$proof/modern-public-selection-summary.json"
          parent="$RUNNER_TEMP/roots/modern-page-ocr-v1"
          parent_proof="$proof/derivation-parent-modern-page-ocr-v1"
          mkdir -p "$parent_proof"
          cp "$parent/manifest.json" "$parent/dataset.lock.json" \
            "$parent/FROZEN.json" "$parent/certification.json" \
            "$parent/CERTIFIED" "$parent/CERTIFIED.json" \
            "$parent/audit.json" "$parent/stats.json" \
            "$parent/attribution.jsonl" "$parent/citations.bib" \
            "$parent_proof/"
          for track in \
            modern-bidi-v1 \
            modern-line-recognition-v1 \
            modern-page-ocr-v1 \
            modern-tables-v1 \
            modern-robustness-v1 \
            modern-handwriting-v1 \
            historical-pinkas-handwriting-v1 \
            historical-hebrew-press-mixed-v1 \
            biblical-niqqud-synthetic-diagnostic-v1 \
            rashi-print-synthetic-diagnostic-v1; do
            case "$track" in
              modern-bidi-v1)
                source="$RUNNER_TEMP/roots/$track"
                ;;
              modern-line-recognition-v1|modern-page-ocr-v1|modern-tables-v1|modern-robustness-v1)
                source="$RUNNER_TEMP/evaluation-roots/$track"
                ;;
              *)
                source="$RUNNER_TEMP/extension-roots/$track"
                ;;
            esac
            destination="$proof/tracks/$track"
            mkdir -p "$destination"
            cp "$source/manifest.json" "$source/dataset.lock.json" \
              "$source/FROZEN.json" "$source/certification.json" \
              "$source/CERTIFIED" "$source/CERTIFIED.json" \
              "$source/audit.json" "$source/stats.json" \
              "$source/attribution.jsonl" "$source/citations.bib" \
              "$destination/"
          done
          python - "$proof/workflow-status.json" "$proof/PROOF-SHA256SUMS.txt" <<'PY'
          import hashlib
          import json
          import sys
          from pathlib import Path

          payload = {
              "schema_version": "1.0",
              "status": "certified-corpus-release-candidate",
              "five_track_suite_built": True,
              "five_track_suite_verified": True,
              "ten_component_full_suite_built": True,
              "ten_component_full_suite_verified": True,
              "release_artifacts_verified": True,
              "costly_model_baselines_executed_by_this_workflow": False,
              "publication_note": (
                  "This deterministic workflow certifies corpus and evaluator artifacts. "
                  "Independent model baselines are a separate publication gate and are not "
                  "simulated or claimed here."
              ),
          }
          status_path = Path(sys.argv[1])
          status_path.write_text(
              json.dumps(payload, indent=2, sort_keys=True) + "\n", encoding="utf-8"
          )
          proof_root = status_path.parent
          checksum_path = Path(sys.argv[2])
          entries = []
          for path in sorted(item for item in proof_root.rglob("*") if item.is_file()):
              if path == checksum_path:
                  continue
              digest = hashlib.sha256(path.read_bytes()).hexdigest()
              entries.append(f"{digest}  {path.relative_to(proof_root).as_posix()}\n")
          checksum_path.write_text("".join(entries), encoding="utf-8")
          PY

      - name: Upload verified release candidate and certification evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hebocrbench-v1-multi-profile-release-candidate-${{ github.sha }}
          path: |
            ${{ runner.temp }}/release
            ${{ runner.temp }}/certification-proof
            ${{ runner.temp }}/sanity
            ${{ runner.temp }}/build-environment.json
          if-no-files-found: error
          include-hidden-files: true
          compression-level: 9
          retention-days: 90
