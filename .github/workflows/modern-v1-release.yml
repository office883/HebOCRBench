name: Build certified HebOCRBench v1 multi-profile release candidate

on:
  workflow_dispatch:
  push:
    tags:
      - 'v1.0.0'
      - 'v1.0.0-*'

permissions:
  contents: read

concurrency:
  group: modern-v1-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHON_VERSION: '3.12.13'
  SHARD_COUNT: '8'
  SELECTION_SHA256: 4c0ebc58784d565f225b8a412ffa93146df4c417de479464f1d9f283ecf7af52
  EFFECTIVE_SELECTION_SHA256: a68d2b1fd1beda4e68b2d426b137abfc393611fcaefcacde7726932174915acd
  NOTO_HEBREW_SHA256: 7ef36a2c3593758cdb622e1bdef4f84523e92fbc3ccc667438dd80ff54c2de88
  NOTO_HEBREW_URL: https://raw.githubusercontent.com/google/fonts/4c1913251a6dd1ba34a6ef4b7a630178d01b88ff/ofl/notosanshebrew/NotoSansHebrew%5Bwdth%2Cwght%5D.ttf
  REGISTRY_FINGERPRINT: 8c0cc599208d4ca1a4ef3d3ead0a57325c4eaad5f27b346714ab9b8045291bfa
  PROFILES_FINGERPRINT: a84ada5741ec4d314075775493bc5d57cc5ec271d3d9d495b199a4b9498da173
  MODERN_SUITE_FINGERPRINT: c68250ec4320485e243171b7d3f86c9b3b526f8ada317eda592cd7289f4df5ea
  FULL_SUITE_FINGERPRINT: 6d2b847121d307b225ec7e785ded7060f40da20b1d8dee28982ef7da06e032d4
  SOURCE_MIRROR_REPOSITORY: ssdataanalysis/hebocrbench-v1-sources
  SOURCE_MIRROR_REVISION: '3d6dcbfedeeeb1234db84131abc92272abff0625'
  PIP_DISABLE_PIP_VERSION_CHECK: '1'

jobs:
  shards:
    name: Download locked shard ${{ matrix.shard }}/7
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: true
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Verify and download immutable PDF bytes
        env:
          SHARD_INDEX: ${{ matrix.shard }}
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/src"
          python scripts/materialize_selection_shard.py \
            --lock-root data/locks \
            --output "$RUNNER_TEMP/shard" \
            --shard-index "$SHARD_INDEX" \
            --shard-count "$SHARD_COUNT"
          python - "$RUNNER_TEMP/shard/SHARD.json" "$SHARD_INDEX" <<'PY'
          import json
          import sys
          from pathlib import Path

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert payload["schema_version"] == "1.0"
          assert payload["selection_sha256"] == "4c0ebc58784d565f225b8a412ffa93146df4c417de479464f1d9f283ecf7af52"
          assert payload["shard_index"] == int(sys.argv[2])
          assert payload["shard_count"] == 8
          assert payload["document_count"] == len(payload["documents"])
          assert payload["document_count"] > 0
          PY

      - name: Upload verified shard
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: modern-v1-shard-${{ matrix.shard }}
          path: ${{ runner.temp }}/shard
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  build:
    name: Assemble, certify and package the ten-component suite
    needs: shards
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONPATH: ${{ github.workspace }}/src
    steps:
      - name: Check out the exact release commit
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up pinned Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            pyproject.toml
            .github/modern-v1-build-constraints.txt

      - name: Set up the pinned Poppler text extractor
        id: poppler
        uses: mamba-org/setup-micromamba@f457c30a868e4760d3a6fcea5f25dc655b8edf39 # v3
        with:
          micromamba-version: '2.3.2-0'
          micromamba-root-path: ${{ runner.temp }}/micromamba
          micromamba-binary-path: ${{ runner.temp }}/bin/micromamba
          environment-name: hebocrbench-poppler
          create-args: >-
            -c conda-forge
            poppler=26.07.0=he594abd_3
          init-shell: none
          cache-downloads: false
          cache-environment: false
          post-cleanup: all

      - name: Expose and verify the pinned Poppler executable
        env:
          POPPLER_ENVIRONMENT: ${{ steps.poppler.outputs.environment-path }}
        shell: bash
        run: |
          set -euo pipefail
          test -x "$POPPLER_ENVIRONMENT/bin/pdftotext"
          version="$($POPPLER_ENVIRONMENT/bin/pdftotext -v 2>&1 | head -n 1)"
          test "$version" = "pdftotext version 26.07.0"
          printf '%s\n' "$POPPLER_ENVIRONMENT/bin" >> "$GITHUB_PATH"

      - name: Install the deterministic extraction stack
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends curl libraqm0
          test "$(pdftotext -v 2>&1 | head -n 1)" = "pdftotext version 26.07.0"
          python -m pip install \
            --requirement .github/modern-v1-build-constraints.txt
          python - <<'PY'
          from importlib.metadata import version
          from PIL import features

          expected = {
              "Pillow": "12.2.0",
              "PyMuPDF": "1.28.2",
              "PyYAML": "6.0.3",
              "numpy": "2.5.2",
              "pyarrow": "23.0.1",
              "python-bidi": "0.6.11",
              "regex": "2026.7.19",
          }
          actual = {name: version(name) for name in expected}
          assert actual == expected, (actual, expected)
          assert features.check("raqm"), "Pillow lacks RAQM; Hebrew shaping would be invalid"
          PY

      - name: Run release-pipeline smoke tests
        run: |
          set -euo pipefail
          python -m pytest -q \
            tests/test_selection_lock.py \
            tests/test_modern_public_materializer.py \
            tests/test_derived_tracks.py \
            tests/test_certification.py \
            tests/test_acquisition.py \
            tests/test_foundation_webdataset_converter.py \
            tests/test_hf_image_text_converter.py \
            tests/test_historical_press_converter.py \
            tests/test_pinkas_webdataset_converter.py \
            tests/test_full_suite.py \
            tests/test_modern_suite.py \
            tests/test_release_build_script.py \
            tests/test_modern_v1_release_workflow.py

      - name: Download all eight verified shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: modern-v1-shard-*
          path: ${{ runner.temp }}/downloaded-shards
          merge-multiple: false

      - name: Require the complete shard set
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shards"
          for index in 0 1 2 3 4 5 6 7; do
            source="$RUNNER_TEMP/downloaded-shards/modern-v1-shard-$index"
            destination=$(printf '%s/shards/shard-%03d' "$RUNNER_TEMP" "$index")
            test -s "$source/SHARD.json"
            mv "$source" "$destination"
          done
          test "$(find "$RUNNER_TEMP/shards" -mindepth 2 -maxdepth 2 -name SHARD.json -type f | wc -l)" -eq "$SHARD_COUNT"

      - name: Assemble the locked source and apply the reviewed replacement lock
        shell: bash
        run: |
          set -euo pipefail
          python scripts/assemble_selection_shards.py \
            --lock-root data/locks \
            --shards "$RUNNER_TEMP/shards" \
            --shard-count "$SHARD_COUNT" \
            --output "$RUNNER_TEMP/sources/modern-public-documents-v1"
          python - "$RUNNER_TEMP/sources/modern-public-documents-v1" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          root = Path(sys.argv[1])
          summary = json.loads((root / "evidence/summary.json").read_text(encoding="utf-8"))
          marker = json.loads((root / ".hebocrbench-source.json").read_text(encoding="utf-8"))
          replacement_lock = json.loads(
              Path("data/locks/modern-public-quality-replacements-v1.json").read_text(
                  encoding="utf-8"
              )
          )
          assert summary["selection_sha256"] == os.environ["SELECTION_SHA256"]
          assert summary["effective_selection_sha256"] == os.environ["EFFECTIVE_SELECTION_SHA256"]
          assert summary["document_count"] == 146
          assert summary["selected_page_count"] == 700
          assert summary["target_reached"] is True
          assert summary["quality_replacements"] == [
              {
                  "add_page": 26,
                  "document_id": "knesset-bill-12458079",
                  "pdf_sha256": "6c584719459959d456ad8efce4373960fc99f75767018eec5139e9ed7b7a20c3",
                  "remove_page": 30,
              }
          ]
          assert replacement_lock["parent_selection_sha256"] == os.environ["SELECTION_SHA256"]
          assert marker["verification_status"] == "verified"
          assert marker["source_version"] == "2026-07-26-v1"
          PY

      - name: Verify the canonical PDF extraction contract
        shell: bash
        run: |
          set -euo pipefail
          python - "$RUNNER_TEMP/sources/modern-public-documents-v1" <<'PY'
          import hashlib
          import math
          from pathlib import Path
          import sys

          import fitz

          from hebocrbench.converters import modern_pdf
          from hebocrbench.converters import _modern_pdf_engine as engine

          root = Path(sys.argv[1])
          pdf = root / "pdfs/knesset-bill-12458079.pdf"
          assert hashlib.sha256(pdf.read_bytes()).hexdigest() == (
              "6c584719459959d456ad8efce4373960fc99f75767018eec5139e9ed7b7a20c3"
          )
          poppler_text = engine._pdftotext_layout(pdf, 26)
          assert hashlib.sha256(poppler_text.encode("utf-8")).hexdigest() == (
              "f487d38f6be4dfc46d324cf8d534c31030a5ab69eb337fb634bc7b6bf3d12d25"
          )
          assert len(engine._comparison_tokens(poppler_text)) == 539

          document = fitz.open(pdf)
          try:
              _, pymupdf_text = engine._extract_regions(document[25], 200 / 72)
          finally:
              document.close()
          assert hashlib.sha256(pymupdf_text.encode("utf-8")).hexdigest() == (
              "5f0f489a303487bc96699261228c662f4e2569d37f2a67591dc1aeb902308d07"
          )
          assert len(engine._comparison_tokens(pymupdf_text)) == 547
          components = engine._agreement_components(pymupdf_text, poppler_text)
          expected = {
              "anchor_content": 0.9829351535836177,
              "anchor_order": 0.9728506787330317,
              "critical_content": 1.0,
              "local_order": 0.9715698393077874,
              "punctuation_content": 0.9855072463768115,
          }
          for key, value in expected.items():
              assert math.isclose(components[key], value, rel_tol=0.0, abs_tol=1e-15), (
                  key,
                  components[key],
                  value,
              )
          assert modern_pdf.text_layer_agreement(
              pymupdf_text,
              poppler_text,
              minimum=0.98,
          ) == expected["anchor_content"]
          PY

      - name: Prepopulate locked extension sources from pinned public mirror
        shell: bash
        run: |
          set -euo pipefail
          mirror="$RUNNER_TEMP/source-mirror"
          cache="$RUNNER_TEMP/extension-sources"
          test ! -e "$mirror"
          test ! -e "$cache"
          test "$SOURCE_MIRROR_REPOSITORY" = "ssdataanalysis/hebocrbench-v1-sources"
          [[ "$SOURCE_MIRROR_REVISION" =~ ^[0-9a-f]{40}$ ]]
          mkdir -p "$mirror" "$cache"

          download_locked() {
            local relative_path="$1"
            local expected_size="$2"
            local expected_sha256="$3"
            local destination="$mirror/$relative_path"
            mkdir -p "$(dirname "$destination")"
            curl --fail --location --silent --show-error \
              --proto '=https' --proto-redir '=https' \
              "https://huggingface.co/datasets/$SOURCE_MIRROR_REPOSITORY/resolve/$SOURCE_MIRROR_REVISION/$relative_path?download=true" \
              --output "$destination.part"
            test "$(stat --format='%s' "$destination.part")" -eq "$expected_size"
            printf '%s  %s\n' "$expected_sha256" "$destination.part" \
              | sha256sum --check --strict
            mv "$destination.part" "$destination"
          }

          download_locked \
            foundation/test-synthetic-mixed-000.tar \
            64563200 \
            12886b77eefb54f73ed2ea9ba9ddf4766de60ed2635126248344739626608927
          download_locked \
            foundation/train-niqqud-000.tar \
            318689280 \
            05cd60b91ce566b23dd7024665026a615f2127b7abfaf8e8a10afd92d3945ff4
          download_locked \
            foundation/train-rashi-000.tar \
            118077440 \
            f1adca1ba117160266325b2002abe62896f06986242ef145a34296852f7190ee
          download_locked \
            htr/stage3_human_finetune/test-00000.parquet \
            18939757 \
            19823993891409e7fc90cac38230822cb88dd2010955a53d4618bfbc226f7d45
          download_locked \
            pinkas/historical-pinkas-handwriting-test-v1.tar \
            418498560 \
            d986a3527d1ddae19cf2f09f3ff5e84458eeb5e1f6f9cb4e2a48d895dfcd5eb6

          python - "$mirror" <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          expected = {
              "foundation/test-synthetic-mixed-000.tar": (
                  64563200,
                  "12886b77eefb54f73ed2ea9ba9ddf4766de60ed2635126248344739626608927",
              ),
              "foundation/train-niqqud-000.tar": (
                  318689280,
                  "05cd60b91ce566b23dd7024665026a615f2127b7abfaf8e8a10afd92d3945ff4",
              ),
              "foundation/train-rashi-000.tar": (
                  118077440,
                  "f1adca1ba117160266325b2002abe62896f06986242ef145a34296852f7190ee",
              ),
              "htr/stage3_human_finetune/test-00000.parquet": (
                  18939757,
                  "19823993891409e7fc90cac38230822cb88dd2010955a53d4618bfbc226f7d45",
              ),
              "pinkas/historical-pinkas-handwriting-test-v1.tar": (
                  418498560,
                  "d986a3527d1ddae19cf2f09f3ff5e84458eeb5e1f6f9cb4e2a48d895dfcd5eb6",
              ),
          }
          actual = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file()
          }
          assert actual == set(expected), (actual, set(expected))
          assert not any(path.is_symlink() for path in root.rglob("*"))
          for relative, (size, expected_sha256) in expected.items():
              path = root / relative
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              assert path.stat().st_size == size, relative
              assert digest.hexdigest() == expected_sha256, relative
          PY

          install -D -m 0644 \
            "$mirror/htr/stage3_human_finetune/test-00000.parquet" \
            "$cache/modern-handwriting-lines-v1/stage3_human_finetune/test-00000.parquet"
          install -D -m 0644 \
            "$mirror/pinkas/historical-pinkas-handwriting-test-v1.tar" \
            "$cache/historical-pinkas-handwriting-v1/historical-pinkas-handwriting-test-v1.tar"
          install -D -m 0644 \
            "$mirror/foundation/test-synthetic-mixed-000.tar" \
            "$cache/biblical-niqqud-synthetic-diagnostic-v1/test-synthetic-mixed-000.tar"
          install -D -m 0644 \
            "$mirror/foundation/train-niqqud-000.tar" \
            "$cache/biblical-niqqud-synthetic-diagnostic-v1/train-niqqud-000.tar"
          install -D -m 0644 \
            "$mirror/foundation/test-synthetic-mixed-000.tar" \
            "$cache/rashi-print-synthetic-diagnostic-v1/test-synthetic-mixed-000.tar"
          install -D -m 0644 \
            "$mirror/foundation/train-rashi-000.tar" \
            "$cache/rashi-print-synthetic-diagnostic-v1/train-rashi-000.tar"

          python - "$cache" <<'PY'
          import hashlib
          from pathlib import Path
          import sys

          root = Path(sys.argv[1])
          expected = {
              "modern-handwriting-lines-v1/stage3_human_finetune/test-00000.parquet": (
                  18939757,
                  "19823993891409e7fc90cac38230822cb88dd2010955a53d4618bfbc226f7d45",
              ),
              "historical-pinkas-handwriting-v1/historical-pinkas-handwriting-test-v1.tar": (
                  418498560,
                  "d986a3527d1ddae19cf2f09f3ff5e84458eeb5e1f6f9cb4e2a48d895dfcd5eb6",
              ),
              "biblical-niqqud-synthetic-diagnostic-v1/test-synthetic-mixed-000.tar": (
                  64563200,
                  "12886b77eefb54f73ed2ea9ba9ddf4766de60ed2635126248344739626608927",
              ),
              "biblical-niqqud-synthetic-diagnostic-v1/train-niqqud-000.tar": (
                  318689280,
                  "05cd60b91ce566b23dd7024665026a615f2127b7abfaf8e8a10afd92d3945ff4",
              ),
              "rashi-print-synthetic-diagnostic-v1/test-synthetic-mixed-000.tar": (
                  64563200,
                  "12886b77eefb54f73ed2ea9ba9ddf4766de60ed2635126248344739626608927",
              ),
              "rashi-print-synthetic-diagnostic-v1/train-rashi-000.tar": (
                  118077440,
                  "f1adca1ba117160266325b2002abe62896f06986242ef145a34296852f7190ee",
              ),
          }
          actual = {
              path.relative_to(root).as_posix()
              for path in root.rglob("*")
              if path.is_file()
          }
          assert actual == set(expected), (actual, set(expected))
          assert not any(path.is_symlink() for path in root.rglob("*"))
          assert not list(root.rglob(".hebocrbench-source.json"))
          for relative, (size, expected_sha256) in expected.items():
              path = root / relative
              digest = hashlib.sha256()
              with path.open("rb") as handle:
                  for chunk in iter(lambda: handle.read(1024 * 1024), b""):
                      digest.update(chunk)
              assert path.stat().st_size == size, relative
              assert digest.hexdigest() == expected_sha256, relative
          PY

      - name: Fetch and verify all locked extension and diagnostic sources
        shell: bash
        run: |
          set -euo pipefail
          cache="$RUNNER_TEMP/extension-sources"
          fetch_report="$RUNNER_TEMP/extension-source-fetch.json"
          python -m hebocrbench data fetch \
            --registry corpora/registry.yaml \
            --source modern-handwriting-lines-v1 \
            --source historical-pinkas-handwriting-v1 \
            --source historical-hebrew-press-mixed-v1 \
            --source biblical-niqqud-synthetic-diagnostic-v1 \
            --source rashi-print-synthetic-diagnostic-v1 \
            --cache "$cache" \
            --extract > "$fetch_report"
          python - "$fetch_report" <<'PY'
          import json
          from pathlib import Path
          import sys

          payload = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          assert set(payload) == {"sources"}
          by_source = {item["source_id"]: item for item in payload["sources"]}
          expected = {
              "modern-handwriting-lines-v1": (1, 0),
              "historical-pinkas-handwriting-v1": (1, 0),
              "biblical-niqqud-synthetic-diagnostic-v1": (2, 0),
              "rashi-print-synthetic-diagnostic-v1": (2, 0),
              "historical-hebrew-press-mixed-v1": (0, 1),
          }
          assert set(by_source) == set(expected), (set(by_source), set(expected))
          for source_id, (cache_hits, downloads) in expected.items():
              source = by_source[source_id]
              artifacts = source["artifacts"]
              assert source["cache_hit_count"] == cache_hits, source_id
              assert source["downloaded_count"] == downloads, source_id
              assert len(artifacts) == cache_hits + downloads, source_id
              assert sum(item["from_cache"] is True for item in artifacts) == cache_hits
              assert sum(item["from_cache"] is False for item in artifacts) == downloads
          press = by_source["historical-hebrew-press-mixed-v1"]
          assert [item["artifact_id"] for item in press["artifacts"]] == [
              "locked-omilab-hazefira-page-alto-zip"
          ]
          assert press["artifacts"][0]["from_cache"] is False
          PY
          python -m hebocrbench data verify \
            --registry corpora/registry.yaml \
            --source modern-handwriting-lines-v1 \
            --source historical-pinkas-handwriting-v1 \
            --source historical-hebrew-press-mixed-v1 \
            --source biblical-niqqud-synthetic-diagnostic-v1 \
            --source rashi-print-synthetic-diagnostic-v1 \
            --cache "$cache"

          for source in biblical-niqqud-synthetic-diagnostic-v1 rashi-print-synthetic-diagnostic-v1; do
            mkdir -p "$cache/$source/shards"
            ln "$cache/$source/test-synthetic-mixed-000.tar" \
              "$cache/$source/shards/test-synthetic-mixed-000.tar"
          done
          ln "$cache/biblical-niqqud-synthetic-diagnostic-v1/train-niqqud-000.tar" \
            "$cache/biblical-niqqud-synthetic-diagnostic-v1/shards/train-niqqud-000.tar"
          ln "$cache/rashi-print-synthetic-diagnostic-v1/train-rashi-000.tar" \
            "$cache/rashi-print-synthetic-diagnostic-v1/shards/train-rashi-000.tar"

          python - "$cache" <<'PY'
          import json
          import os
          from pathlib import Path
          import sys

          cache = Path(sys.argv[1])
          registry_lock = json.loads(Path("corpora/registry.lock.json").read_text())
          profiles_lock = json.loads(Path("corpora/profiles.lock.json").read_text())
          assert registry_lock["registry_fingerprint"] == os.environ["REGISTRY_FINGERPRINT"]
          assert profiles_lock["profiles_fingerprint"] == os.environ["PROFILES_FINGERPRINT"]
          expected_artifacts = {
              "modern-handwriting-lines-v1": {"locked-human-test-parquet"},
              "historical-pinkas-handwriting-v1": {"locked-pinkas-test-webdataset"},
              "historical-hebrew-press-mixed-v1": {
                  "locked-omilab-hazefira-page-alto-zip"
              },
              "biblical-niqqud-synthetic-diagnostic-v1": {
                  "locked-foundation-synthetic-test",
                  "locked-foundation-niqqud-train-reference",
              },
              "rashi-print-synthetic-diagnostic-v1": {
                  "locked-foundation-synthetic-test",
                  "locked-foundation-rashi-train-reference",
              },
          }
          for source_id, artifact_ids in expected_artifacts.items():
