            --output "$full_suite"
          python -m hebocrbench full-suite verify \
            --registry corpora/registry.yaml \
            --profiles corpora/profiles.yaml \
            --lock "$full_suite" \
            --component-root "modern-bidi-v1=$RUNNER_TEMP/roots/modern-bidi-v1" \
            --component-root "modern-line-recognition-v1=$roots/modern-line-recognition-v1" \
            --component-root "modern-page-ocr-v1=$roots/modern-page-ocr-v1" \
            --component-root "modern-tables-v1=$roots/modern-tables-v1" \
            --component-root "modern-robustness-v1=$roots/modern-robustness-v1" \
            --component-root "modern-handwriting-v1=$RUNNER_TEMP/extension-roots/modern-handwriting-v1" \
            --component-root "historical-pinkas-handwriting-v1=$RUNNER_TEMP/extension-roots/historical-pinkas-handwriting-v1" \
            --component-root "historical-hebrew-press-mixed-v1=$RUNNER_TEMP/extension-roots/historical-hebrew-press-mixed-v1" \
            --component-root "biblical-niqqud-synthetic-diagnostic-v1=$RUNNER_TEMP/extension-roots/biblical-niqqud-synthetic-diagnostic-v1" \
            --component-root "rashi-print-synthetic-diagnostic-v1=$RUNNER_TEMP/extension-roots/rashi-print-synthetic-diagnostic-v1"
          python - "$suite" "$full_suite" <<'PY'
          import json
          import os
          import sys
          from pathlib import Path

          suite = json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          full_suite = json.loads(Path(sys.argv[2]).read_text(encoding="utf-8"))
          expected_modern = {
              "modern-bidi-v1",
              "modern-line-recognition-v1",
              "modern-page-ocr-v1",
              "modern-tables-v1",
              "modern-robustness-v1",
          }
          expected_full = expected_modern | {
              "modern-handwriting-v1",
              "historical-pinkas-handwriting-v1",
              "historical-hebrew-press-mixed-v1",
              "biblical-niqqud-synthetic-diagnostic-v1",
              "rashi-print-synthetic-diagnostic-v1",
          }
          expected_missing = {
              "modern-forms-v1",
              "biblical-cantillation-real-v1",
              "rashi-pure-print-real-v1",
          }
          assert set(suite["tracks"]) == expected_modern
          assert suite["suite_fingerprint"] == os.environ["MODERN_SUITE_FINGERPRINT"]
          assert all(
              suite["tracks"][track]["maturity"] == "certified"
              for track in expected_modern
          )
          assert all(
              suite["tracks"][track]["headline"] is True
              for track in expected_modern
          )
          assert full_suite["suite_fingerprint"] == os.environ["FULL_SUITE_FINGERPRINT"]
          assert full_suite["registry_fingerprint"] == os.environ["REGISTRY_FINGERPRINT"]
          assert full_suite["profiles_fingerprint"] == os.environ["PROFILES_FINGERPRINT"]
          certified = {
              component_id
              for component_id, component in full_suite["components"].items()
              if component["status"] == "certified"
          }
          missing = {
              component_id
              for component_id, component in full_suite["components"].items()
              if component["status"] == "missing"
          }
          assert certified == expected_full
          assert missing == expected_missing
          assert full_suite["reporting_policy"]["cross_family_score"] == "forbidden"
          coverage = full_suite["coverage"]
          assert coverage["modern_headline_status"] == "complete"
          assert coverage["modern_headline_missing_components"] == []
          assert set(coverage["real_public_fixed_extensions_available"]) == {
              "modern-handwriting-v1",
              "historical-pinkas-handwriting-v1",
              "historical-hebrew-press-mixed-v1",
          }
          assert coverage["real_public_fixed_extensions_missing"] == []
          assert set(coverage["synthetic_diagnostics_available"]) == {
              "biblical-niqqud-synthetic-diagnostic-v1",
              "rashi-print-synthetic-diagnostic-v1",
          }
          assert coverage["synthetic_diagnostics_missing"] == []
          assert coverage["declared_real_target_coverage"] == "incomplete"
          assert set(coverage["unresolved_real_coverage_gaps"]) == {
              "biblical-cantillation-real-v1",
              "rashi-pure-print-real-v1",
          }
          PY

