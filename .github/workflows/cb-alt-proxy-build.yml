name: Temporary Christina Block alternate proxy middle build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cb-alt-proxy-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg ca-certificates
          python -m pip install --quiet --upgrade requests

      - name: Discover a working proxy and download full reaction
        run: |
          set -euxo pipefail
          cat > /tmp/proxy_download.py <<'PY'
          from __future__ import annotations

          import concurrent.futures
          import json
          import pathlib
          import re
          import shutil
          import subprocess
          import threading
          import time
          import traceback
          from urllib.parse import urlparse

          import requests

          VIDEO_ID = "HOW33afxE6g"
          OUT = pathlib.Path("proxy_download")
          OUT.mkdir(exist_ok=True)
          UA = "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 Chrome/140 Safari/537.36"
          session = requests.Session()
          session.headers.update({"User-Agent": UA, "Accept": "application/json, */*"})
          report: dict[str, object] = {"video_id": VIDEO_ID, "lists": [], "tests": []}
          report_lock = threading.Lock()

          def base_url(value: str) -> str | None:
              if not value:
                  return None
              value = value.strip().rstrip("/")
              if not value.startswith("http"):
                  value = "https://" + value
              try:
                  p = urlparse(value)
                  if not p.netloc:
                      return None
                  return f"{p.scheme}://{p.netloc}"
              except Exception:
                  return None

          def fetch_json(url: str, timeout: tuple[int, int] = (10, 45)):
              r = session.get(url, timeout=timeout, allow_redirects=True)
              r.raise_for_status()
              return r.json(), {"url": url, "status": r.status_code, "bytes": len(r.content)}

          invidious: set[str] = {
              "https://inv.nadeko.net",
              "https://invidious.nerdvpn.de",
              "https://invidious.private.coffee",
              "https://yewtu.be",
              "https://inv.us.projectsegfau.lt",
              "https://invidious.projectsegfau.lt",
              "https://inv.tux.pizza",
              "https://invidious.privacyredirect.com",
              "https://inv.perditum.com",
              "https://inv.riverside.rocks",
              "https://invidious.fdn.fr",
              "https://invidious.jing.rocks",
              "https://invidious.einfachzocken.eu",
              "https://invidious.materialio.us",
              "https://inv.in.projectsegfau.lt",
              "https://inv.bp.projectsegfau.lt",
              "https://invidious.drgns.space",
              "https://invidious.darkness.services",
              "https://invidious.nerdvpn.de",
              "https://yt.artemislena.eu",
              "https://inv.vern.cc",
              "https://iv.ggtyler.dev",
          }
          piped: set[str] = {
              "https://pipedapi.kavin.rocks",
              "https://pipedapi.adminforge.de",
              "https://pipedapi.reallyaweso.me",
              "https://pipedapi.darkness.services",
              "https://pipedapi.drgns.space",
              "https://pipedapi.owo.si",
              "https://pipedapi.ducks.party",
              "https://piped-api.codespace.cz",
              "https://api.piped.private.coffee",
              "https://pipedapi.orangenet.cc",
              "https://pipedapi.wireway.ch",
              "https://pipedapi.leptons.xyz",
              "https://pipedapi.nosebs.ru",
              "https://piped-api.privacy.com.de",
              "https://pipedapi.r4fo.com",
              "https://piped-api.lunar.icu",
              "https://pipedapi.kavin.rocks",
              "https://pipedapi.moomoo.me",
          }

          # Current Invidious instance registry.
          for list_url in [
              "https://api.invidious.io/instances.json?sort_by=health",
              "https://api.invidious.io/instances.json?pretty=1&sort_by=type,users",
          ]:
              try:
                  data, meta = fetch_json(list_url)
                  meta["entries"] = len(data) if isinstance(data, list) else None
                  report["lists"].append(meta)
                  if isinstance(data, list):
                      for row in data:
                          if not isinstance(row, list) or len(row) < 2:
                              continue
                          domain, details = row[0], row[1] or {}
                          if isinstance(details, dict) and details.get("type") == "https" and details.get("api") is True:
                              b = base_url(domain)
                              if b:
                                  invidious.add(b)
              except Exception:
                  report["lists"].append({"url": list_url, "error": traceback.format_exc()})

          # Piped instance registries and community mirrors use several schemas.
          for list_url in [
              "https://piped.video/api/v1/instances",
              "https://piped.video/api/v1/instances/",
              "https://pipedapi.kavin.rocks/instances",
              "https://piped-instances.kavin.rocks/",
              "https://raw.githubusercontent.com/wiki/TeamPiped/Piped-Frontend/Instances.md",
          ]:
              try:
                  r = session.get(list_url, timeout=(10, 60), allow_redirects=True)
                  r.raise_for_status()
                  report["lists"].append({"url": list_url, "status": r.status_code, "bytes": len(r.content)})
                  text = r.text
                  try:
                      data = r.json()
                  except Exception:
                      data = None
                  values: list[str] = []
                  if isinstance(data, list):
                      for row in data:
                          if isinstance(row, str):
                              values.append(row)
                          elif isinstance(row, dict):
                              for key in ("api_url", "apiUrl", "api", "url"):
                                  value = row.get(key)
                                  if isinstance(value, str):
                                      values.append(value)
                  elif isinstance(data, dict):
                      for value in data.values():
                          if isinstance(value, str):
                              values.append(value)
                          elif isinstance(value, list):
                              for row in value:
                                  if isinstance(row, str):
                                      values.append(row)
                                  elif isinstance(row, dict):
                                      values.extend(str(row.get(k)) for k in ("api_url", "apiUrl", "api", "url") if row.get(k))
                  values += re.findall(r"https://[A-Za-z0-9._:-]+", text)
                  for value in values:
                      b = base_url(value)
                      if b and any(token in b.lower() for token in ("piped", "pipe", "api")):
                          piped.add(b)
              except Exception:
                  report["lists"].append({"url": list_url, "error": traceback.format_exc()})

          print(f"Discovered {len(invidious)} Invidious and {len(piped)} Piped bases", flush=True)
          print("INVIDIOUS", sorted(invidious), flush=True)
          print("PIPED", sorted(piped), flush=True)

          def qnum(value: object) -> int:
              match = re.search(r"(\d+)", str(value or ""))
              return int(match.group(1)) if match else 0

          def byte_test(url: str, headers: dict[str, str] | None = None) -> dict[str, object]:
              h = {"User-Agent": UA, "Accept": "*/*", "Range": "bytes=0-262143"}
              if headers:
                  h.update(headers)
              with session.get(url, headers=h, stream=True, timeout=(15, 90), allow_redirects=True) as r:
                  chunk = next(r.iter_content(262144), b"")
                  return {
                      "status": r.status_code,
                      "content_type": r.headers.get("content-type"),
                      "content_length": r.headers.get("content-length"),
                      "content_range": r.headers.get("content-range"),
                      "final_host": urlparse(r.url).netloc,
                      "bytes": len(chunk),
                      "magic": chunk[:32].hex(),
                  }

          candidates: list[dict[str, object]] = []

          def test_invidious(base: str) -> dict[str, object]:
              rec: dict[str, object] = {"kind": "invidious", "base": base}
              try:
                  started = time.time()
                  r = requests.get(
                      f"{base}/api/v1/videos/{VIDEO_ID}",
                      headers={"User-Agent": UA, "Accept": "application/json"},
                      timeout=(8, 35),
                      allow_redirects=True,
                  )
                  rec.update(status=r.status_code, seconds=round(time.time() - started, 2), content_type=r.headers.get("content-type"), prefix=r.text[:500])
                  if r.status_code != 200:
                      return rec
                  data = r.json()
                  rec.update(title=data.get("title"), duration=data.get("lengthSeconds"), format_count=len(data.get("formatStreams") or []), adaptive_count=len(data.get("adaptiveFormats") or []))
                  duration = int(float(data.get("lengthSeconds") or 0))
                  if not 2545 <= duration <= 2565:
                      return rec

                  formats = data.get("formatStreams") or []
                  progressive = [f for f in formats if f.get("url")]
                  progressive.sort(key=lambda f: (qnum(f.get("qualityLabel") or f.get("quality")) <= 720, min(qnum(f.get("qualityLabel") or f.get("quality")), 720), int(f.get("bitrate") or 0)), reverse=True)
                  for f in progressive:
                      q = qnum(f.get("qualityLabel") or f.get("quality"))
                      if q > 720:
                          continue
                      urls = []
                      itag = f.get("itag")
                      if itag:
                          urls.append(("local_proxy", f"{base}/latest_version?id={VIDEO_ID}&itag={itag}&local=true"))
                          urls.append(("proxy", f"{base}/latest_version?id={VIDEO_ID}&itag={itag}"))
                      urls.append(("direct", f["url"]))
                      for mode, url in urls:
                          try:
                              probe = byte_test(url, {"Referer": base + "/"})
                              rec.setdefault("probes", []).append({"mode": mode, "quality": q, "itag": itag, "url": url, "probe": probe})
                              if probe.get("status") in (200, 206) and int(probe.get("bytes") or 0) >= 16_000:
                                  with report_lock:
                                      candidates.append({"kind": "single", "source": "invidious", "base": base, "url": url, "quality": q, "headers": {"Referer": base + "/", "User-Agent": UA}})
                                  return rec
                          except Exception as e:
                              rec.setdefault("probes", []).append({"mode": mode, "quality": q, "itag": itag, "error": f"{type(e).__name__}: {e}"})
              except Exception:
                  rec["error"] = traceback.format_exc()
              return rec

          def test_piped(base: str) -> dict[str, object]:
              rec: dict[str, object] = {"kind": "piped", "base": base}
              try:
                  started = time.time()
                  r = requests.get(
                      f"{base}/streams/{VIDEO_ID}",
                      headers={"User-Agent": UA, "Accept": "application/json"},
                      timeout=(8, 40),
                      allow_redirects=True,
                  )
                  rec.update(status=r.status_code, seconds=round(time.time() - started, 2), content_type=r.headers.get("content-type"), prefix=r.text[:500])
                  if r.status_code != 200:
                      return rec
                  data = r.json()
                  rec.update(title=data.get("title"), duration=data.get("duration"), video_count=len(data.get("videoStreams") or []), audio_count=len(data.get("audioStreams") or []))
                  duration = int(float(data.get("duration") or 0))
                  if not 2545 <= duration <= 2565:
                      return rec
                  videos = [v for v in (data.get("videoStreams") or []) if v.get("url")]
                  audios = [a for a in (data.get("audioStreams") or []) if a.get("url")]
                  progressive = [v for v in videos if not v.get("videoOnly")]
                  progressive.sort(key=lambda v: (qnum(v.get("quality")) <= 720, min(qnum(v.get("quality")), 720), int(v.get("bitrate") or 0)), reverse=True)
                  for v in progressive:
                      q = qnum(v.get("quality"))
                      if q > 720:
                          continue
                      try:
                          probe = byte_test(v["url"], {"Referer": base + "/"})
                          rec.setdefault("probes", []).append({"mode": "progressive", "quality": q, "probe": probe})
                          if probe.get("status") in (200, 206) and int(probe.get("bytes") or 0) >= 16_000:
                              with report_lock:
                                  candidates.append({"kind": "single", "source": "piped", "base": base, "url": v["url"], "quality": q, "headers": {"Referer": base + "/", "User-Agent": UA}})
                              return rec
                      except Exception as e:
                          rec.setdefault("probes", []).append({"mode": "progressive", "quality": q, "error": f"{type(e).__name__}: {e}"})

                  video_only = [v for v in videos if v.get("videoOnly") and qnum(v.get("quality")) <= 720]
                  video_only.sort(key=lambda v: (min(qnum(v.get("quality")), 720), int(v.get("bitrate") or 0)), reverse=True)
                  audios.sort(key=lambda a: int(a.get("bitrate") or 0), reverse=True)
                  if video_only and audios:
                      v, a = video_only[0], audios[0]
                      try:
                          vp = byte_test(v["url"], {"Referer": base + "/"})
                          ap = byte_test(a["url"], {"Referer": base + "/"})
                          rec.setdefault("probes", []).append({"mode": "separate", "quality": qnum(v.get("quality")), "video_probe": vp, "audio_probe": ap})
                          if vp.get("status") in (200, 206) and ap.get("status") in (200, 206) and int(vp.get("bytes") or 0) >= 16_000 and int(ap.get("bytes") or 0) >= 8_000:
                              with report_lock:
                                  candidates.append({"kind": "separate", "source": "piped", "base": base, "video_url": v["url"], "audio_url": a["url"], "quality": qnum(v.get("quality")), "headers": {"Referer": base + "/", "User-Agent": UA}})
                              return rec
                      except Exception as e:
                          rec.setdefault("probes", []).append({"mode": "separate", "error": f"{type(e).__name__}: {e}"})
              except Exception:
                  rec["error"] = traceback.format_exc()
              return rec

          tasks: list[tuple[str, str]] = [("invidious", b) for b in sorted(invidious)] + [("piped", b) for b in sorted(piped)]
          with concurrent.futures.ThreadPoolExecutor(max_workers=30) as executor:
              futures = {
                  executor.submit(test_invidious if kind == "invidious" else test_piped, base): (kind, base)
                  for kind, base in tasks
              }
              for future in concurrent.futures.as_completed(futures):
                  rec = future.result()
                  report["tests"].append(rec)
                  print(rec.get("kind"), rec.get("base"), rec.get("status"), rec.get("title"), "CANDIDATES", len(candidates), flush=True)

          report["candidates"] = candidates
          pathlib.Path("proxy_probe_report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2, default=str), encoding="utf-8")
          if not candidates:
              raise SystemExit("No current Invidious or Piped instance yielded accessible media")

          def download(url: str, path: pathlib.Path, headers: dict[str, str]) -> None:
              h = {"User-Agent": UA, "Accept": "*/*"}
              h.update(headers)
              with requests.get(url, headers=h, stream=True, timeout=(30, 3600), allow_redirects=True) as r:
                  r.raise_for_status()
                  size = 0
                  with path.open("wb") as f:
                      for chunk in r.iter_content(1024 * 1024):
                          if not chunk:
                              continue
                          f.write(chunk)
                          size += len(chunk)
                          if size % (50 * 1024 * 1024) < 1024 * 1024:
                              print("downloaded", size, "bytes", flush=True)
              if path.stat().st_size < 10_000_000:
                  raise RuntimeError(f"Downloaded file too small: {path.stat().st_size}")

          def valid_media(path: pathlib.Path, require_audio: bool = True) -> tuple[bool, dict[str, object]]:
              p = subprocess.run([
                  "ffprobe", "-v", "error", "-show_entries",
                  "format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels",
                  "-of", "json", str(path),
              ], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=180)
              if p.returncode != 0:
                  return False, {"returncode": p.returncode, "output": p.stdout}
              data = json.loads(p.stdout)
              duration = float(data.get("format", {}).get("duration") or 0)
              streams = data.get("streams") or []
              ok = 2545 <= duration <= 2565 and any(s.get("codec_type") == "video" for s in streams)
              if require_audio:
                  ok = ok and any(s.get("codec_type") == "audio" for s in streams)
              return ok, data

          source: pathlib.Path | None = None
          attempts: list[dict[str, object]] = []
          for index, candidate in enumerate(sorted(candidates, key=lambda c: int(c.get("quality") or 0), reverse=True)):
              rec = {"candidate": candidate}
              attempts.append(rec)
              try:
                  if candidate["kind"] == "single":
                      raw = OUT / f"candidate_{index:02d}.bin"
                      download(str(candidate["url"]), raw, dict(candidate.get("headers") or {}))
                      ok, probe = valid_media(raw, require_audio=True)
                      rec["probe"] = probe
                      if ok:
                          source = pathlib.Path("reaction_source.mp4")
                          shutil.copy2(raw, source)
                          break
                  else:
                      v = OUT / f"candidate_{index:02d}_video.bin"
                      a = OUT / f"candidate_{index:02d}_audio.bin"
                      download(str(candidate["video_url"]), v, dict(candidate.get("headers") or {}))
                      download(str(candidate["audio_url"]), a, dict(candidate.get("headers") or {}))
                      merged = OUT / f"candidate_{index:02d}_merged.mkv"
                      subprocess.run(["ffmpeg", "-hide_banner", "-loglevel", "error", "-y", "-i", str(v), "-i", str(a), "-map", "0:v:0", "-map", "1:a:0", "-c", "copy", str(merged)], check=True, timeout=900)
                      ok, probe = valid_media(merged, require_audio=True)
                      rec["probe"] = probe
                      if ok:
                          source = pathlib.Path("reaction_source.mkv")
                          shutil.copy2(merged, source)
                          break
              except Exception:
                  rec["error"] = traceback.format_exc()

          report["download_attempts"] = attempts
          pathlib.Path("proxy_probe_report.json").write_text(json.dumps(report, ensure_ascii=False, indent=2, default=str), encoding="utf-8")
          if source is None:
              raise SystemExit("Candidate streams were discovered but none produced a valid full reaction file")
          pathlib.Path("source_path.txt").write_text(str(source), encoding="utf-8")
          print("VALID SOURCE", source, source.stat().st_size, flush=True)
          PY
          python /tmp/proxy_download.py 2>&1 | tee proxy_download.log
          INPUT="$(cat source_path.txt)"
          echo "INPUT=$INPUT" >> "$GITHUB_ENV"
          ls -lh "$INPUT" proxy_probe_report.json

      - name: Render exact clean middle
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          segments=[
            (400,418),(424,451),(467,470),(473,494),
            (518,553),(558,648),(691,696),(708,710),
            (726,734),(735,761),(772,799),(821,825),
            (826,871),(888,945),(985,998),(1005,1098),
            (1123,1126),(1139,1141),(1150,1164),(1167,1180),
            (1195,1214),(1235,1238),(1254,1270),(1291,1303),
            (1312,1314),(1325,1335),(1340,1344),(1346,1431),
            (1487,1503),(1509,1542),(1549,1575),(1584,1627),
            (1657,1661),(1671,1726),(1734,1783),(1799,1813),
            (1836,1859),(1883,2021),
          ]
          assert len(segments)==38 and sum(b-a for a,b in segments)==1058
          Path('segments.tsv').write_text('\n'.join(f'{i:02d}\t{a}\t{b}' for i,(a,b) in enumerate(segments)),encoding='utf-8')
          Path('middle_manifest.txt').write_text('segments=38\nexpected_duration_seconds=1058\n'+'\n'.join(f'{i+1:02d}: {a}-{b} ({b-a}s)' for i,(a,b) in enumerate(segments))+'\n',encoding='utf-8')
          PY
          mkdir -p rendered_segments
          : > concat.txt
          while IFS=$'\t' read -r idx start end; do
            duration=$((end-start))
            ffmpeg -hide_banner -loglevel error -y -ss "$start" -i "$INPUT" -t "$duration" \
              -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p" \
              -af "aresample=48000:async=1:first_pts=0,aformat=sample_fmts=fltp:sample_rates=48000:channel_layouts=stereo" \
              -c:v libx264 -preset veryfast -crf 18 -profile:v high -level 4.1 \
              -c:a aac -b:a 192k -ar 48000 -ac 2 "rendered_segments/seg_${idx}.mp4"
            printf "file '%s'\n" "$PWD/rendered_segments/seg_${idx}.mp4" >> concat.txt
          done < segments.tsv
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i concat.txt -c copy -movflags +faststart middle_clean.mp4
          ffprobe -v error -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels -of json middle_clean.mp4 | tee middle_probe.json
          python - <<'PY'
          import json
          d=json.load(open('middle_probe.json',encoding='utf-8'))
          duration=float(d['format']['duration'])
          assert 1057.4<=duration<=1059.0,duration
          print(f'Validated middle: {duration:.3f}s')
          PY
          ffmpeg -v error -i middle_clean.mp4 -f null -
          sha256sum middle_clean.mp4 | tee middle_clean.sha256

      - name: Upload build artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: christina-block-alt-proxy-middle-build
          path: |
            middle_clean.mp4
            middle_clean.sha256
            middle_probe.json
            middle_manifest.txt
            proxy_probe_report.json
            proxy_download.log
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
