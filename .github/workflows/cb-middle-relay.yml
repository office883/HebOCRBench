name: Temporary Christina Block middle relay

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cb-middle-relay.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - name: Wait for remotely rendered middle segment
        run: |
          set -euo pipefail
          FILE_URL='https://filebin.net/ricivzzx58ygduk3/cb_middle_a7f4c9.mp4'
          ERROR_URL='https://filebin.net/ricivzzx58ygduk3/cb_middle_a7f4c9_error.txt'
          STATUS_URL='https://filebin.net/ricivzzx58ygduk3/cb_middle_a7f4c9_status.txt'
          found=0
          for attempt in $(seq 1 300); do
            if curl -fsSL --connect-timeout 10 --max-time 20 "$ERROR_URL" -o remote_error.txt 2>/dev/null; then
              echo 'Remote render reported an error:'
              cat remote_error.txt
              exit 1
            fi

            if (( attempt % 4 == 1 )); then
              echo "Polling remote render (attempt $attempt/300)..."
              curl -fsSL --connect-timeout 10 --max-time 20 "$STATUS_URL" 2>/dev/null || true
              echo
            fi

            headers="$(curl -fsSIL --connect-timeout 10 --max-time 30 "$FILE_URL" 2>/dev/null || true)"
            length="$(printf '%s\n' "$headers" | tr -d '\r' | awk 'tolower($1)=="content-length:" {n=$2} END{print n+0}')"
            if [ "${length:-0}" -gt 10000000 ]; then
              echo "Remote file is ready (${length} bytes); downloading once."
              curl -fL --retry 5 --retry-delay 5 --connect-timeout 20 --max-time 1800 \
                "$FILE_URL" -o middle_clean.mp4
              found=1
              break
            fi
            sleep 15
          done
          test "$found" -eq 1 || { echo 'Timed out waiting for remote file'; exit 1; }
          test "$(stat -c%s middle_clean.mp4)" -gt 10000000
          sha256sum middle_clean.mp4 | tee middle_clean.sha256

      - name: Install FFmpeg and validate artifact
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          ffprobe -v error \
            -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels \
            -of json middle_clean.mp4 | tee middle_probe.json
          python - <<'PY'
          import json
          with open('middle_probe.json', encoding='utf-8') as f:
              data=json.load(f)
          duration=float(data['format']['duration'])
          if not 1057.4 <= duration <= 1058.6:
              raise SystemExit(f'Unexpected duration: {duration}')
          streams=data.get('streams',[])
          if not any(s.get('codec_type')=='video' for s in streams):
              raise SystemExit('No video stream')
          if not any(s.get('codec_type')=='audio' for s in streams):
              raise SystemExit('No audio stream')
          print(f'Validated clean middle duration: {duration:.3f}s')
          PY
          ffmpeg -v error -i middle_clean.mp4 -f null -

      - name: Upload clean middle artifact
        uses: actions/upload-artifact@v4
        with:
          name: christina-block-middle-clean-a7f4c9
          path: |
            middle_clean.mp4
            middle_clean.sha256
            middle_probe.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
