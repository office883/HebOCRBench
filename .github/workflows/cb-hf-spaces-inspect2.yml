name: Temporary Christina Block alternate Spaces inspect

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cb-hf-spaces-inspect2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Inspect source and Gradio endpoints
        run: |
          set -euxo pipefail
          python -m pip install --quiet --upgrade huggingface_hub gradio_client
          cat > /tmp/space_probe.py <<'PY'
          from __future__ import annotations
          import contextlib, io, json, pathlib, traceback
          from huggingface_hub import HfApi, hf_hub_download
          from gradio_client import Client

          SPACES=[
            'ilhamdev/youtube_downloader',
            'fhsp93/youtube-video-downloader',
            'Gresekxnol/clipyr',
            'artyomboyko/Aura_AI_Scan',
          ]
          api=HfApi()
          root=pathlib.Path('alternate_spaces'); root.mkdir(exist_ok=True)
          report={}
          for repo_id in SPACES:
            rec={'repo_id':repo_id}
            out=root/repo_id.replace('/','__'); out.mkdir(exist_ok=True)
            try:
              info=api.space_info(repo_id,files_metadata=True)
              rec['sdk']=getattr(info,'sdk',None)
              rec['runtime']=getattr(getattr(info,'runtime',None),'__dict__',str(getattr(info,'runtime',None)))
              files=[s.rfilename for s in (getattr(info,'siblings',None) or [])]
              rec['files']=files
              candidates=[f for f in files if f.lower().endswith(('.py','.js','.ts','.json','.txt','.md')) and not f.startswith('.')]
              rec['sources']=[]
              for f in candidates[:40]:
                try:
                  local=hf_hub_download(repo_id=repo_id,repo_type='space',filename=f)
                  data=pathlib.Path(local).read_bytes()
                  if len(data)<=750000:
                    dest=out/f.replace('/','__'); dest.write_bytes(data)
                    rec['sources'].append({'path':f,'bytes':len(data),'dest':str(dest)})
                except Exception as e:
                  rec['sources'].append({'path':f,'error':f'{type(e).__name__}: {e}'})
            except Exception:
              rec['hub_error']=traceback.format_exc()
            try:
              capture=io.StringIO()
              with contextlib.redirect_stdout(capture), contextlib.redirect_stderr(capture):
                client=Client(repo_id,verbose=False)
                rec['api']=client.view_api(return_format='dict')
                rec['src']=getattr(client,'src',None)
              rec['client_log']=capture.getvalue()
            except Exception:
              rec['gradio_error']=traceback.format_exc()
            report[repo_id]=rec
            print('\n===',repo_id,'===')
            print(json.dumps(rec,ensure_ascii=False,indent=2,default=str))
          (root/'report.json').write_text(json.dumps(report,ensure_ascii=False,indent=2,default=str),encoding='utf-8')
          PY
          python /tmp/space_probe.py | tee alternate_spaces.log

      - name: Upload inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cb-alternate-spaces-inspect
          path: |
            alternate_spaces/
            alternate_spaces.log
          retention-days: 1
          if-no-files-found: warn
