name: Temporary Christina Block macOS middle build

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cb-macos-ytdlp-build.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-middle:
    runs-on: macos-14
    timeout-minutes: 120
    steps:
      - name: Install downloader and media tools
        run: |
          set -euxo pipefail
          command -v ffmpeg >/dev/null 2>&1 || brew install ffmpeg
          python3 -m pip install --quiet --upgrade pip
          python3 -m pip install --quiet --upgrade 'yt-dlp[default,curl-cffi]'
          yt-dlp --version
          ffmpeg -version | head -n 3
          node --version
          {
            echo 'MACOS_EGRESS_IP:'
            curl -fsS --max-time 30 https://api.ipify.org || true
            echo
          } | tee network_macos.txt

      - name: Download reaction video
        run: |
          set -euxo pipefail
          URL='https://www.youtube.com/watch?v=HOW33afxE6g'
          rm -f reaction.*
          : > yt_dlp_macos.log
          success=0
          run_try() {
            label="$1"; shift
            echo "===== ATTEMPT: $label =====" | tee -a yt_dlp_macos.log
            if yt-dlp -v --no-playlist --newline \
              --retries 12 --fragment-retries 12 --concurrent-fragments 4 \
              --js-runtimes node --remote-components ejs:github \
              --impersonate chrome \
              -f 'bv*[height<=720]+ba/b[height<=720]' \
              --merge-output-format mkv -o 'reaction.%(ext)s' \
              "$@" "$URL" 2>&1 | tee -a yt_dlp_macos.log; then
              success=1
              return 0
            fi
            rm -f reaction.*
            return 1
          }
          run_try 'macOS default' || \
          run_try 'macOS web_safari' --extractor-args 'youtube:player_client=web_safari' || \
          run_try 'macOS ios' --extractor-args 'youtube:player_client=ios' || \
          run_try 'macOS mweb' --extractor-args 'youtube:player_client=mweb' || true
          test "$success" -eq 1
          INPUT="$(python3 - <<'PY'
          from pathlib import Path
          files=[p for p in Path('.').glob('reaction.*') if p.suffix not in {'.part','.ytdl'}]
          print(max(files,key=lambda p:p.stat().st_size) if files else '')
          PY
          )"
          test -n "$INPUT"
          python3 - "$INPUT" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          assert p.stat().st_size>10_000_000,p.stat().st_size
          PY
          echo "INPUT=$INPUT" >> "$GITHUB_ENV"
          ls -lh "$INPUT"

      - name: Validate source
        run: |
          set -euxo pipefail
          ffprobe -v error -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels -of json "$INPUT" | tee source_probe.json
          python3 - <<'PY'
          import json
          d=json.load(open('source_probe.json'))
          duration=float(d['format']['duration'])
          streams=d.get('streams',[])
          assert 2545<=duration<=2565,duration
          assert any(s.get('codec_type')=='video' for s in streams)
          assert any(s.get('codec_type')=='audio' for s in streams)
          print(f'Validated source: {duration:.3f}s')
          PY

      - name: Render 38 exact keep segments
        run: |
          set -euxo pipefail
          python3 - <<'PY'
          from pathlib import Path
          segments=[
            (400,418),(424,451),(467,470),(473,494),
            (518,553),(558,648),(691,696),(708,710),
            (726,734),(735,761),(772,799),(821,825),
            (826,871),(888,945),(985,998),(1005,1098),
            (1123,1126),(1139,1141),(1150,1164),(1167,1180),
            (1195,1214),(1235,1238),(1254,1270),(1291,1303),
            (1312,1314),(1325,1335),(1340,1344),(1346,1431),
            (1487,1503),(1509,1542),(1549,1575),(1584,1627),
            (1657,1661),(1671,1726),(1734,1783),(1799,1813),
            (1836,1859),(1883,2021),
          ]
          assert len(segments)==38 and sum(b-a for a,b in segments)==1058
          Path('segments.tsv').write_text('\n'.join(f'{i:02d}\t{a}\t{b}' for i,(a,b) in enumerate(segments)))
          Path('middle_manifest.txt').write_text('segments=38\nexpected_duration_seconds=1058\n'+'\n'.join(f'{i+1:02d}: {a}-{b} ({b-a}s)' for i,(a,b) in enumerate(segments))+'\n')
          PY
          mkdir -p rendered_segments
          : > concat.txt
          while IFS=$'\t' read -r idx start end; do
            duration=$((end-start))
            ffmpeg -hide_banner -loglevel error -y -ss "$start" -i "$INPUT" -t "$duration" \
              -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p" \
              -af "aresample=48000:async=1:first_pts=0,aformat=sample_fmts=fltp:sample_rates=48000:channel_layouts=stereo" \
              -c:v libx264 -preset veryfast -crf 18 -profile:v high -level 4.1 \
              -c:a aac -b:a 192k -ar 48000 -ac 2 "rendered_segments/seg_${idx}.mp4"
            printf "file '%s'\n" "$PWD/rendered_segments/seg_${idx}.mp4" >> concat.txt
          done < segments.tsv
          ffmpeg -hide_banner -loglevel error -y -f concat -safe 0 -i concat.txt -c copy -movflags +faststart middle_clean.mp4
          ffprobe -v error -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels -of json middle_clean.mp4 | tee middle_probe.json
          python3 - <<'PY'
          import json
          d=json.load(open('middle_probe.json'))
          duration=float(d['format']['duration'])
          assert 1057.4<=duration<=1059.0,duration
          print(f'Validated middle: {duration:.3f}s')
          PY
          ffmpeg -v error -i middle_clean.mp4 -f null -
          shasum -a 256 middle_clean.mp4 | tee middle_clean.sha256

      - name: Upload clean middle and diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: christina-block-macos-middle-build
          path: |
            middle_clean.mp4
            middle_clean.sha256
            middle_probe.json
            middle_manifest.txt
            source_probe.json
            yt_dlp_macos.log
            network_macos.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
