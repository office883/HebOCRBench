name: Temporary Christina Block clean middle

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/tmp-christina-block-middle.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  encode-batch:
    name: Encode batch ${{ matrix.batch }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        batch: [0, 1, 2, 3]

    steps:
      - name: Install FFmpeg and gdown
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          python -m pip install --quiet --upgrade gdown

      - name: Download and verify source
        run: |
          set -euxo pipefail
          gdown 'https://drive.google.com/uc?id=1sExpLofblqNUUxbwWQrPUE7kSRWK19nz' -O reaction_full.mp4
          test "$(stat -c%s reaction_full.mp4)" -eq 741568607
          if [ "${{ matrix.batch }}" = "0" ]; then
            sha256sum reaction_full.mp4 > source.sha256
            ffprobe -v error \
              -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels \
              -of json reaction_full.mp4 > source_probe.json
          fi

      - name: Prepare this batch
        env:
          BATCH: ${{ matrix.batch }}
        run: |
          set -euxo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          segments = [
              (400,418),(424,451),(467,470),(473,494),
              (518,553),(558,648),(691,696),(708,710),
              (726,734),(735,761),(772,799),(821,825),
              (826,871),(888,945),(985,998),(1005,1098),
              (1123,1126),(1139,1141),(1150,1164),(1167,1180),
              (1195,1214),(1235,1238),(1254,1270),(1291,1303),
              (1312,1314),(1325,1335),(1340,1344),(1346,1431),
              (1487,1503),(1509,1542),(1549,1575),(1584,1627),
              (1657,1661),(1671,1726),(1734,1783),(1799,1813),
              (1836,1859),(1883,2021),
          ]
          assert len(segments) == 38
          assert sum(end-start for start,end in segments) == 1058

          batch = int(os.environ['BATCH'])
          batch_ranges = [(0,10), (10,20), (20,29), (29,38)]
          lo, hi = batch_ranges[batch]
          selected = [(index, *segments[index]) for index in range(lo, hi)]
          Path('batch.tsv').write_text(
              '\n'.join(f'{index:02d}\t{start}\t{end}' for index,start,end in selected) + '\n',
              encoding='utf-8',
          )
          print(f'Batch {batch}: indexes {lo}..{hi-1}, {len(selected)} segments')
          PY

      - name: Encode batch segments in parallel
        run: |
          set -euxo pipefail
          mkdir -p segments
          export INPUT="$PWD/reaction_full.mp4"
          export OUTDIR="$PWD/segments"
          cat batch.tsv | xargs -P 2 -n 3 bash -c '
            set -euo pipefail
            idx="$1"; start="$2"; end="$3"
            duration=$((end-start))
            ffmpeg -hide_banner -loglevel error -y \
              -ss "$start" -i "$INPUT" -t "$duration" \
              -map 0:v:0 -map 0:a:0 \
              -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=25,format=yuv420p" \
              -af "aresample=48000:async=1:first_pts=0,aformat=sample_fmts=fltp:sample_rates=48000:channel_layouts=stereo" \
              -c:v libx264 -preset ultrafast -crf 19 -profile:v high -level 4.1 -threads 1 \
              -c:a aac -b:a 192k -ar 48000 -ac 2 \
              -movflags +faststart "$OUTDIR/seg_${idx}.mp4"
            test "$(stat -c%s "$OUTDIR/seg_${idx}.mp4")" -gt 50000
          ' _
          find segments -type f -name 'seg_*.mp4' -print | sort

      - name: Upload batch
        uses: actions/upload-artifact@v4
        with:
          name: cb-middle-batch-${{ matrix.batch }}
          path: |
            segments/
            source.sha256
            source_probe.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

  assemble:
    name: Assemble and validate middle
    needs: encode-batch
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Install FFmpeg
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg

      - name: Download all encoded batches
        uses: actions/download-artifact@v4
        with:
          pattern: cb-middle-batch-*
          path: all_batches
          merge-multiple: true

      - name: Assemble exact sequence
        run: |
          set -euxo pipefail
          mapfile -t files < <(find all_batches -type f -name 'seg_*.mp4' | sort)
          test "${#files[@]}" -eq 38
          : > concat.txt
          for file in "${files[@]}"; do
            printf "file '%s'\n" "$PWD/$file" >> concat.txt
          done
          cat concat.txt
          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i concat.txt \
            -map 0:v:0 -map 0:a:0 -c copy -movflags +faststart \
            middle_clean.mp4
          ffprobe -v error \
            -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels \
            -of json middle_clean.mp4 | tee middle_probe.json
          python - <<'PY'
          import json
          from pathlib import Path

          data = json.load(open('middle_probe.json', encoding='utf-8'))
          duration = float(data['format']['duration'])
          streams = data.get('streams', [])
          assert 1057.0 <= duration <= 1060.5, duration
          assert any(s.get('codec_type') == 'video' for s in streams)
          assert any(s.get('codec_type') == 'audio' for s in streams)
          assert any(s.get('width') == 1280 and s.get('height') == 720 for s in streams)
          Path('middle_manifest.txt').write_text(
              f'segments=38\nexpected_duration_seconds=1058\nrendered_duration_seconds={duration:.6f}\n',
              encoding='utf-8',
          )
          print(f'Clean middle validated: {duration:.3f}s')
          PY
          ffmpeg -v error -i middle_clean.mp4 -t 30 -f null -
          sha256sum middle_clean.mp4 | tee middle_clean.sha256
          ls -lh middle_clean.mp4

      - name: Upload clean middle
        uses: actions/upload-artifact@v4
        with:
          name: christina-block-clean-middle
          path: |
            middle_clean.mp4
            middle_clean.sha256
            middle_probe.json
            middle_manifest.txt
            all_batches/source.sha256
            all_batches/source_probe.json
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
