name: Temporary Christina Block Python downloader

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cb-python-youtube-download.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install current Python downloader stack and FFmpeg
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg ca-certificates
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade --pre 'yt-dlp[default,curl-cffi,deno]' pytubefix
          python - <<'PY'
          import shutil
          import yt_dlp
          import pytubefix
          print('yt-dlp', yt_dlp.version.__version__)
          print('pytubefix', getattr(pytubefix, '__version__', 'unknown'))
          print('deno', shutil.which('deno'))
          PY
          deno --version
          ffmpeg -version | head -n 3

      - name: Download video through the corrected Python APIs
        run: |
          set -euxo pipefail
          cat > /tmp/download_video.py <<'PY'
          from __future__ import annotations

          import json
          import pathlib
          import shutil
          import subprocess
          import traceback

          URL = 'https://www.youtube.com/watch?v=HOW33afxE6g'
          WORK = pathlib.Path('python_download')
          WORK.mkdir(exist_ok=True)
          report: dict[str, object] = {'url': URL, 'attempts': []}

          def probe(path: pathlib.Path) -> dict:
              p = subprocess.run([
                  'ffprobe', '-v', 'error',
                  '-show_entries',
                  'format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels',
                  '-of', 'json', str(path),
              ], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=180)
              if p.returncode:
                  return {'returncode': p.returncode, 'output': p.stdout}
              return json.loads(p.stdout)

          def valid(path: pathlib.Path) -> tuple[bool, dict]:
              data = probe(path)
              try:
                  duration = float(data['format']['duration'])
                  streams = data.get('streams') or []
                  return (
                      2545 <= duration <= 2565
                      and any(s.get('codec_type') == 'video' for s in streams)
                      and any(s.get('codec_type') == 'audio' for s in streams)
                  ), data
              except Exception:
                  return False, data

          def choose_valid(prefix: str) -> tuple[pathlib.Path | None, dict | None]:
              files = [
                  p for p in WORK.glob(prefix + '.*')
                  if p.is_file() and p.suffix not in ('.part', '.ytdl', '.json')
              ]
              files.sort(key=lambda p: p.stat().st_size, reverse=True)
              last_probe = None
              for candidate in files:
                  ok, data = valid(candidate)
                  last_probe = data
                  if ok:
                      return candidate, data
              return None, last_probe

          source: pathlib.Path | None = None

          # This is the actual yt-dlp embedding API, not a shell invocation.
          from yt_dlp import YoutubeDL
          client_sets: list[tuple[str, list[str] | None]] = [
              ('default', None),
              ('web_safari', ['web_safari']),
              ('ios', ['ios']),
              ('mweb', ['mweb']),
              ('tv', ['tv']),
              ('tv_embedded', ['tv_embedded']),
              ('android_vr', ['android_vr']),
              ('web', ['web']),
          ]

          for label, clients in client_sets:
              rec: dict[str, object] = {'library': 'yt-dlp', 'client_set': label}
              report['attempts'].append(rec)
              prefix = f'ytdlp_{label}'
              try:
                  opts: dict[str, object] = {
                      'format': 'bv*[height<=720]+ba/b[height<=720]',
                      'outtmpl': str(WORK / f'{prefix}.%(ext)s'),
                      'merge_output_format': 'mkv',
                      'noplaylist': True,
                      'quiet': False,
                      'verbose': True,
                      'retries': 10,
                      'fragment_retries': 10,
                      'concurrent_fragment_downloads': 4,
                      'continuedl': True,
                      'overwrites': True,
                      'windowsfilenames': True,
                  }
                  if clients:
                      opts['extractor_args'] = {'youtube': {'player_client': clients}}
                  with YoutubeDL(opts) as ydl:
                      info = ydl.extract_info(URL, download=True)
                      rec['title'] = info.get('title')
                      rec['duration'] = info.get('duration')
                      rec['format_id'] = info.get('format_id')
                  path, data = choose_valid(prefix)
                  rec['probe'] = data
                  if path is not None:
                      source = pathlib.Path('reaction_source' + (path.suffix or '.mkv'))
                      shutil.copy2(path, source)
                      rec['success'] = True
                      rec['source_candidate'] = str(path)
                      break
                  rec['success'] = False
              except Exception:
                  rec['error'] = traceback.format_exc()
              print(json.dumps(rec, ensure_ascii=False, indent=2, default=str), flush=True)

          # Independent fallback extractor. It often needs a PO token on data-centre IPs,
          # but testing it here gives us a definitive result rather than an assumption.
          if source is None:
              try:
                  from pytubefix import YouTube
                  for client in (None, 'WEB', 'TV', 'MWEB', 'ANDROID', 'IOS'):
                      rec = {'library': 'pytubefix', 'client': client}
                      report['attempts'].append(rec)
                      try:
                          kwargs = {} if client is None else {'client': client}
                          yt = YouTube(URL, **kwargs)
                          rec['title'] = yt.title
                          rec['length'] = yt.length
                          streams = list(yt.streams)
                          progressive = [
                              s for s in streams
                              if s.is_progressive and s.subtype == 'mp4' and s.resolution
                              and int(s.resolution.rstrip('p')) <= 720
                          ]
                          progressive.sort(key=lambda s: int(s.resolution.rstrip('p')), reverse=True)
                          if not progressive:
                              raise RuntimeError('No progressive MP4 stream returned')
                          path = pathlib.Path(progressive[0].download(
                              output_path=str(WORK), filename=f'pytubefix_{client or "default"}.mp4'
                          ))
                          ok, data = valid(path)
                          rec['probe'] = data
                          if ok:
                              source = pathlib.Path('reaction_source.mp4')
                              shutil.copy2(path, source)
                              rec['success'] = True
                              break
                          rec['success'] = False
                      except Exception:
                          rec['error'] = traceback.format_exc()
                      print(json.dumps(rec, ensure_ascii=False, indent=2, default=str), flush=True)
                  
              except Exception:
                  report['pytubefix_import_error'] = traceback.format_exc()

          pathlib.Path('python_download_report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2, default=str), encoding='utf-8'
          )
          if source is None:
              raise SystemExit('Python libraries could not obtain a valid full source video')
          pathlib.Path('source_path.txt').write_text(str(source), encoding='utf-8')
          print('SOURCE=', source, 'BYTES=', source.stat().st_size, flush=True)
          PY
          python /tmp/download_video.py 2>&1 | tee python_download.log
          INPUT="$(cat source_path.txt)"
          echo "INPUT=$INPUT" >> "$GITHUB_ENV"
          ffprobe -v error \
            -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels \
            -of json "$INPUT" | tee source_probe.json

      - name: Cut and join the 38 clean middle segments
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          segments = [
              (400,418),(424,451),(467,470),(473,494),
              (518,553),(558,648),(691,696),(708,710),
              (726,734),(735,761),(772,799),(821,825),
              (826,871),(888,945),(985,998),(1005,1098),
              (1123,1126),(1139,1141),(1150,1164),(1167,1180),
              (1195,1214),(1235,1238),(1254,1270),(1291,1303),
              (1312,1314),(1325,1335),(1340,1344),(1346,1431),
              (1487,1503),(1509,1542),(1549,1575),(1584,1627),
              (1657,1661),(1671,1726),(1734,1783),(1799,1813),
              (1836,1859),(1883,2021),
          ]
          assert len(segments) == 38
          assert sum(b-a for a,b in segments) == 1058
          Path('segments.tsv').write_text(
              '\n'.join(f'{i:02d}\t{a}\t{b}' for i,(a,b) in enumerate(segments)), encoding='utf-8'
          )
          Path('middle_manifest.txt').write_text(
              'segments=38\nexpected_duration_seconds=1058\n' +
              '\n'.join(f'{i+1:02d}: {a}-{b} ({b-a}s)' for i,(a,b) in enumerate(segments)) + '\n',
              encoding='utf-8',
          )
          PY
          mkdir -p rendered_segments
          : > concat.txt
          while IFS=$'\t' read -r idx start end; do
            duration=$((end-start))
            ffmpeg -hide_banner -loglevel error -y -ss "$start" -i "$INPUT" -t "$duration" \
              -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p" \
              -af "aresample=48000:async=1:first_pts=0,aformat=sample_fmts=fltp:sample_rates=48000:channel_layouts=stereo" \
              -c:v libx264 -preset veryfast -crf 18 -profile:v high -level 4.1 \
              -c:a aac -b:a 192k -ar 48000 -ac 2 "rendered_segments/seg_${idx}.mp4"
            printf "file '%s'\n" "$PWD/rendered_segments/seg_${idx}.mp4" >> concat.txt
          done < segments.tsv
          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i concat.txt -c copy -movflags +faststart middle_clean.mp4
          ffprobe -v error \
            -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels \
            -of json middle_clean.mp4 | tee middle_probe.json
          python - <<'PY'
          import json
          data = json.load(open('middle_probe.json', encoding='utf-8'))
          duration = float(data['format']['duration'])
          assert 1057.4 <= duration <= 1059.0, duration
          print(f'Validated clean middle: {duration:.3f}s')
          PY
          ffmpeg -v error -i middle_clean.mp4 -f null -
          sha256sum middle_clean.mp4 | tee middle_clean.sha256

      - name: Upload only a verified output, plus diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: christina-block-python-middle
          path: |
            middle_clean.mp4
            middle_clean.sha256
            middle_probe.json
            middle_manifest.txt
            source_probe.json
            python_download_report.json
            python_download.log
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
