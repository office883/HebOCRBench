name: Temporary Christina Block Python downloader

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/cb-python-youtube-download.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Install yt-dlp Python API, PO-token provider, and FFmpeg
        run: |
          set -euxo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg ca-certificates curl
          python -m pip install --quiet --upgrade pip
          python -m pip install --quiet --upgrade --pre \
            'yt-dlp[default,curl-cffi,deno]' \
            bgutil-ytdlp-pot-provider \
            pytubefix
          docker pull brainicism/bgutil-ytdlp-pot-provider:latest
          docker run --name bgutil-provider -d --init --net=host \
            brainicism/bgutil-ytdlp-pot-provider:latest
          sleep 6
          docker ps --filter name=bgutil-provider
          docker logs bgutil-provider | tail -n 80 || true
          curl -sS --max-time 10 http://127.0.0.1:4416/ || true
          python - <<'PY'
          import shutil
          import yt_dlp
          print('yt-dlp', yt_dlp.version.__version__)
          print('deno', shutil.which('deno'))
          PY
          deno --version

      - name: Download video using yt-dlp as a Python library with PO tokens
        run: |
          set -euxo pipefail
          cat > /tmp/download_video.py <<'PY'
          from __future__ import annotations

          import json
          import pathlib
          import shutil
          import subprocess
          import traceback

          from yt_dlp import YoutubeDL

          URL = 'https://www.youtube.com/watch?v=HOW33afxE6g'
          WORK = pathlib.Path('python_download')
          WORK.mkdir(exist_ok=True)
          report: dict[str, object] = {'url': URL, 'attempts': []}

          def probe(path: pathlib.Path) -> dict:
              proc = subprocess.run([
                  'ffprobe', '-v', 'error',
                  '-show_entries',
                  'format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels',
                  '-of', 'json', str(path),
              ], stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True, timeout=180)
              if proc.returncode:
                  return {'returncode': proc.returncode, 'output': proc.stdout}
              return json.loads(proc.stdout)

          def is_valid(path: pathlib.Path) -> tuple[bool, dict]:
              data = probe(path)
              try:
                  duration = float(data['format']['duration'])
                  streams = data.get('streams') or []
                  return (
                      2545 <= duration <= 2565
                      and any(s.get('codec_type') == 'video' for s in streams)
                      and any(s.get('codec_type') == 'audio' for s in streams)
                  ), data
              except Exception:
                  return False, data

          source: pathlib.Path | None = None
          attempts: list[tuple[str, list[str] | None]] = [
              ('default', None),
              ('web_safari', ['web_safari']),
              ('mweb', ['mweb']),
              ('tv', ['tv']),
              ('ios', ['ios']),
              ('android_vr', ['android_vr']),
          ]

          for label, clients in attempts:
              prefix = f'ytdlp_{label}'
              rec: dict[str, object] = {'library': 'yt-dlp', 'client_set': label}
              report['attempts'].append(rec)
              try:
                  extractor_args: dict[str, dict[str, list[str]]] = {
                      'youtubepot-bgutilhttp': {
                          'base_url': ['http://127.0.0.1:4416'],
                      },
                  }
                  if clients:
                      extractor_args['youtube'] = {'player_client': clients}

                  opts: dict[str, object] = {
                      'format': 'bv*[height<=720]+ba/b[height<=720]',
                      'outtmpl': str(WORK / f'{prefix}.%(ext)s'),
                      'merge_output_format': 'mkv',
                      'noplaylist': True,
                      'quiet': False,
                      'verbose': True,
                      'retries': 10,
                      'fragment_retries': 10,
                      'concurrent_fragment_downloads': 4,
                      'overwrites': True,
                      'extractor_args': extractor_args,
                  }
                  with YoutubeDL(opts) as ydl:
                      info = ydl.extract_info(URL, download=True)
                      rec['title'] = info.get('title')
                      rec['duration'] = info.get('duration')
                      rec['format_id'] = info.get('format_id')

                  candidates = [
                      path for path in WORK.glob(prefix + '.*')
                      if path.is_file() and path.suffix not in ('.part', '.ytdl', '.json')
                  ]
                  candidates.sort(key=lambda path: path.stat().st_size, reverse=True)
                  for candidate in candidates:
                      ok, data = is_valid(candidate)
                      rec.setdefault('probes', []).append({'path': str(candidate), 'probe': data})
                      if ok:
                          source = pathlib.Path('reaction_source' + (candidate.suffix or '.mkv'))
                          shutil.copy2(candidate, source)
                          rec['success'] = True
                          rec['source_candidate'] = str(candidate)
                          break
                  if source is not None:
                      break
                  rec['success'] = False
              except Exception:
                  rec['error'] = traceback.format_exc()
              print(json.dumps(rec, ensure_ascii=False, indent=2, default=str), flush=True)

          pathlib.Path('python_download_report.json').write_text(
              json.dumps(report, ensure_ascii=False, indent=2, default=str), encoding='utf-8'
          )
          if source is None:
              raise SystemExit('yt-dlp with the PO-token provider could not obtain a valid source')
          pathlib.Path('source_path.txt').write_text(str(source), encoding='utf-8')
          print('SOURCE=', source, 'BYTES=', source.stat().st_size, flush=True)
          PY
          python /tmp/download_video.py 2>&1 | tee python_download.log
          INPUT="$(cat source_path.txt)"
          echo "INPUT=$INPUT" >> "$GITHUB_ENV"
          ffprobe -v error \
            -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels \
            -of json "$INPUT" | tee source_probe.json

      - name: Cut and join the 38 clean middle segments
        run: |
          set -euxo pipefail
          python - <<'PY'
          from pathlib import Path
          segments = [
              (400,418),(424,451),(467,470),(473,494),
              (518,553),(558,648),(691,696),(708,710),
              (726,734),(735,761),(772,799),(821,825),
              (826,871),(888,945),(985,998),(1005,1098),
              (1123,1126),(1139,1141),(1150,1164),(1167,1180),
              (1195,1214),(1235,1238),(1254,1270),(1291,1303),
              (1312,1314),(1325,1335),(1340,1344),(1346,1431),
              (1487,1503),(1509,1542),(1549,1575),(1584,1627),
              (1657,1661),(1671,1726),(1734,1783),(1799,1813),
              (1836,1859),(1883,2021),
          ]
          assert len(segments) == 38
          assert sum(end-start for start,end in segments) == 1058
          Path('segments.tsv').write_text(
              '\n'.join(f'{index:02d}\t{start}\t{end}' for index,(start,end) in enumerate(segments)),
              encoding='utf-8',
          )
          Path('middle_manifest.txt').write_text(
              'segments=38\nexpected_duration_seconds=1058\n' +
              '\n'.join(
                  f'{index+1:02d}: {start}-{end} ({end-start}s)'
                  for index,(start,end) in enumerate(segments)
              ) + '\n',
              encoding='utf-8',
          )
          PY
          mkdir -p rendered_segments
          : > concat.txt
          while IFS=$'\t' read -r idx start end; do
            duration=$((end-start))
            ffmpeg -hide_banner -loglevel error -y \
              -ss "$start" -i "$INPUT" -t "$duration" \
              -vf "scale=1280:720:force_original_aspect_ratio=decrease,pad=1280:720:(ow-iw)/2:(oh-ih)/2,setsar=1,fps=30,format=yuv420p" \
              -af "aresample=48000:async=1:first_pts=0,aformat=sample_fmts=fltp:sample_rates=48000:channel_layouts=stereo" \
              -c:v libx264 -preset veryfast -crf 18 -profile:v high -level 4.1 \
              -c:a aac -b:a 192k -ar 48000 -ac 2 \
              "rendered_segments/seg_${idx}.mp4"
            printf "file '%s'\n" "$PWD/rendered_segments/seg_${idx}.mp4" >> concat.txt
          done < segments.tsv
          ffmpeg -hide_banner -loglevel error -y \
            -f concat -safe 0 -i concat.txt -c copy -movflags +faststart middle_clean.mp4
          ffprobe -v error \
            -show_entries format=duration,size:stream=index,codec_name,codec_type,width,height,r_frame_rate,avg_frame_rate,sample_rate,channels \
            -of json middle_clean.mp4 | tee middle_probe.json
          python - <<'PY'
          import json
          data = json.load(open('middle_probe.json', encoding='utf-8'))
          duration = float(data['format']['duration'])
          assert 1057.4 <= duration <= 1059.0, duration
          print(f'Validated clean middle: {duration:.3f}s')
          PY
          ffmpeg -v error -i middle_clean.mp4 -f null -
          sha256sum middle_clean.mp4 | tee middle_clean.sha256

      - name: Upload verified output or diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: christina-block-python-middle
          path: |
            middle_clean.mp4
            middle_clean.sha256
            middle_probe.json
            middle_manifest.txt
            source_probe.json
            python_download_report.json
            python_download.log
          compression-level: 0
          retention-days: 1
          if-no-files-found: warn
