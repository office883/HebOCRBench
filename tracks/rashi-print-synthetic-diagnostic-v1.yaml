schema_version: '1.0'
track:
  id: rashi-print-synthetic-diagnostic-v1
  version: 1.0.0
  title: Synthetic Noto Rashi Hebrew typeface diagnostic
  description: Held-out 500-line single-family synthetic Rashi probe; public-fixed, non-rankable, excluded from headline scores, and not real historical-print evidence.
  official: true
  task: synthetic-rashi-print-diagnostic
  prediction_mode: oracle-layout
  accepted_gold_tracks: [rashi_print_synthetic_diagnostic]
  required_prediction_fields: [page_id, regions, regions.lines.line_id, regions.lines.text]
  primary_metrics:
    - recognition.line_gcer
    - recognition.line_cer
    - recognition.line_wer
    - recognition.line_exact_rate
matching:
  use_shared_ids: true
  line_iou_threshold: 0.30
  region_iou_threshold: 0.50
conformance:
  diagnostic_track: rashi_print_synthetic_diagnostic
  min_exact_line_rate: 0.95
  min_ltr_run_exact_rate: 0.98
  min_numeric_exact_rate: 0.99
  min_bracket_exact_rate: 0.99
  max_visual_order_failure_count: 0
  max_bidi_control_count: 0
  max_unbalanced_bidi_controls: 0
statistics:
  bootstrap_samples: 2000
  confidence: 0.95
  seed: 20260725
  worst_page_count: 25
  worst_slice_min_pages: 10
slice_fields:
  - metadata.font.family
  - metadata.font.style
  - metadata.source_profile
  - metadata.coverage_scope
  - metadata.historical_scan_status
