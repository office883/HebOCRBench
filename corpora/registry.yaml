      ratios:
        test: 1.0
      seed: 20260725
    metadata:
      script_style: historical_hebrew_press_mixed_square_rashi
      era: historical
      document_type: newspaper
      layout_type: multi_column
      vocalization: none
      source_type: real_historical_print_page_scan
      source_collection: HaZefira historical Hebrew newspaper
      benchmark_data_status: real-public-fixed
      coverage_scope: narrow-single-newspaper-mixed-square-rashi
      annotation_formats:
      - PAGE XML 2013-07-15
      - ALTO 2.0
      expected_pages: 34
      expected_lines: 4016
      expected_pagexml_files: 34
      expected_alto_files: 34
      rashi_annotation_scope: none
      pure_rashi_claim: false
      headline_eligible: false
      rankable: true
    notes: >-
      The locked official ZIP contains 34 real scans with paired PAGE and ALTO
      annotations and exactly 4,016 TextLine identities. PAGE supplies benchmark
      text and geometry; ALTO is checked fail-closed for paired page, line-ID and
      non-whitespace-text parity. OmiLab describes the collection as containing
      both square (Meruba) and Rashi print, but the annotations do not identify
      Rashi regions or lines. Report only the full mixed-script historical-press
      extension, never a pure-Rashi subset or score.
