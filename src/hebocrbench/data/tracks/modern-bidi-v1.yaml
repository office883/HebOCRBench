schema_version: '1.0'
track:
  id: modern-bidi-v1
  version: 1.0.0
  title: Modern Hebrew Unicode and BiDi conformance
  description: Strict logical-order evaluation of Hebrew with numbers, Latin runs, URLs, identifiers, punctuation and brackets.
  official: true
  task: unicode-conformance
  prediction_mode: unicode-conformance
  accepted_gold_tracks: [modern_bidi]
  required_prediction_fields: [page_id, regions, regions.lines.text]
  primary_metrics:
    - conformance.status
    - conformance.strict_line_exact_rate
    - bidi.ltr_run_exact_rate
    - bidi.numeric_exact_rate
    - bidi.bracket_exact_rate
matching:
  use_shared_ids: false
  line_iou_threshold: 0.30
  region_iou_threshold: 0.50
conformance:
  diagnostic_track: modern_bidi
  min_exact_line_rate: 0.98
  min_ltr_run_exact_rate: 0.99
  min_numeric_exact_rate: 0.995
  min_bracket_exact_rate: 0.995
  max_visual_order_failure_count: 0
  max_bidi_control_count: 0
  max_unbalanced_bidi_controls: 0
statistics:
  bootstrap_samples: 2000
  confidence: 0.95
  seed: 20260725
  worst_page_count: 25
  worst_slice_min_pages: 1
slice_fields: [track, metadata.case_family]
